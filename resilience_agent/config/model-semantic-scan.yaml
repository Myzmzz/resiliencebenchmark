schema_version: resilience-agent-model.v1
provider: openai-compatible
protocol: responses
base_url_env: RESILIENCE_AGENT_LLM_BASE_URL
base_url_default: https://api.nexustokenai.com
api_key_env: RESILIENCE_AGENT_LLM_API_KEY
api_key_keychain_service: resilience-agent-llm
model_env: RESILIENCE_AGENT_LLM_MODEL
model_default: gpt-5.5
reasoning_effort: medium
text_verbosity: low
store: false
timeout_seconds: 600
max_transport_retries: 0
max_output_tokens: 6000
max_tool_rounds: 8
max_tool_result_chars: 6000
parallel_tool_calls: true
