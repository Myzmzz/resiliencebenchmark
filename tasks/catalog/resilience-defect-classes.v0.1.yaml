catalog_version: resilience-defect-catalog.v0.1
catalog_id: resilience-defect-classes-30
description: Public catalog of representative microservice resilience defect classes. Each item is a DefectSpec-class entry, not a hidden Ground Truth instance.
items:
  - schema_version: defect-spec.v0.1
    defect_id: RBD-001
    title: Missing outbound request timeout
    status: candidate
    family: timeout
    summary: A service waits indefinitely or for the platform default when a downstream call stalls.
    latent_defect:
      description: Outbound HTTP, gRPC, database, or message calls are made without an explicit deadline.
      mechanism: A slow dependency holds request threads and connection slots until upstream saturation propagates.
      likely_locations: ["HTTP clients", "gRPC clients", "database query wrappers", "message RPC adapters"]
      risk_conditions: ["dependency latency spike", "partial packet loss", "small worker pool", "synchronous request path"]
    fault_trigger:
      trigger_class: latency
      actuator_candidates: ["network delay", "dependency slow response", "database query delay"]
      parameters: ["target dependency", "delay duration", "duration window", "traffic profile"]
      guardrails: ["single target service", "bounded duration", "cleanup verified before next experiment"]
    failure_outcome:
      slo_impact: Request p95 or error rate violates the business SLO during a bounded downstream stall.
      user_visible_symptom: Users observe hung requests, gateway timeouts, or missing responses.
      expected_degradation: Upstream latency and in-flight requests grow before downstream error metrics dominate.
      invalid_outcomes: ["control-plane injection failed", "no workload during trigger", "target pod not selected"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["order", "travel", "ticketinfo", "payment"]
        rationale: The request graph contains many synchronous service-to-service calls.
      - app: otel-demo
        fit: secondary
        candidate_targets: ["frontend", "checkoutservice", "cartservice"]
        rationale: The demo has clear trace edges and baseline telemetry for latency propagation.
    observable_evidence:
      metrics: ["client request duration", "server request duration", "in-flight requests", "timeout/error counters"]
      traces: ["long child span under a short parent request", "missing deadline or cancellation attributes"]
      logs: ["late response", "context deadline absent", "connection pool wait"]
      kubernetes: ["pod readiness remains true while request latency grows"]
      source: ["client construction without timeout", "call sites missing context deadline"]
    recovery:
      cleanup: ["remove latency trigger", "wait for in-flight requests to drain"]
      verification: ["SLO returns to baseline", "no active fault object remains", "error rate stabilizes"]
    leakage_controls:
      agent_visible: true
      public_hints: ["timeout-family defect class"]
      forbidden_disclosures: ["exact locked service", "exact defective call site", "patch diff"]
      answer_leakage_risks: ["source comments that name the benchmark defect"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-002
    title: Deadline not propagated across calls
    status: candidate
    family: timeout
    summary: An upstream request has a deadline, but downstream calls ignore or replace it with a longer budget.
    latent_defect:
      description: Request-scoped deadlines are not forwarded through internal service calls.
      mechanism: Child calls continue after the user request has already failed, wasting capacity and masking cancellation.
      likely_locations: ["context creation", "thread-local request wrappers", "async task submission", "RPC interceptors"]
      risk_conditions: ["multi-hop request path", "slow downstream", "short external SLO", "background continuation"]
    fault_trigger:
      trigger_class: latency
      actuator_candidates: ["network delay", "dependency slow response"]
      parameters: ["parent request SLO", "child dependency delay", "duration window"]
      guardrails: ["bounded service subset", "single injected dependency", "recovery check after trigger"]
    failure_outcome:
      slo_impact: The user request times out while internal work continues and consumes capacity.
      user_visible_symptom: User sees timeout or error, followed by delayed side effects or resource saturation.
      expected_degradation: Child spans outlive the parent span and continue after cancellation should occur.
      invalid_outcomes: ["parent path has no deadline", "child call not exercised", "fault exceeds episode budget"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["order", "preserve", "cancel", "payment"]
      - app: otel-demo
        fit: secondary
        candidate_targets: ["frontend", "checkoutservice", "shippingservice"]
    observable_evidence:
      metrics: ["parent timeout count", "downstream request count after parent failure", "worker utilization"]
      traces: ["child spans ending after parent span", "missing propagated timeout attributes"]
      logs: ["request cancelled upstream but downstream action completed", "late write"]
      kubernetes: ["pods remain ready while request backlog grows"]
      source: ["new root context in handler", "lost context parameter", "async task without cancellation token"]
    recovery:
      cleanup: ["remove latency trigger", "drain delayed downstream work"]
      verification: ["no child spans continue after workload stops", "request latency returns to baseline"]
    leakage_controls:
      agent_visible: true
      public_hints: ["deadline propagation may matter"]
      forbidden_disclosures: ["exact function that drops context", "hidden causal chain"]
      answer_leakage_risks: ["trace attributes with explicit injected label"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-003
    title: Cancellation not propagated to work units
    status: candidate
    family: timeout
    summary: Expensive local or asynchronous work continues after the caller abandons the request.
    latent_defect:
      description: Local workers, futures, or background tasks do not observe request cancellation.
      mechanism: Abandoned work keeps CPU, memory, locks, or downstream calls busy after the result is no longer useful.
      likely_locations: ["executor submission", "promise/future callbacks", "bulk operations", "stream processing"]
      risk_conditions: ["client abort", "short timeout", "expensive operation", "shared worker pool"]
    fault_trigger:
      trigger_class: workload_spike
      actuator_candidates: ["client timeout workload", "request abort workload", "dependency delay"]
      parameters: ["abort ratio", "request rate", "operation duration"]
      guardrails: ["no data-destructive workload", "bounded concurrency", "clear recovery window"]
    failure_outcome:
      slo_impact: Useful throughput drops because abandoned work competes with live requests.
      user_visible_symptom: Later users see slow responses or errors even after the original clients disconnected.
      expected_degradation: CPU or worker queue remains elevated after the triggering workload stops.
      invalid_outcomes: ["load generator did not abort requests", "background work is not exercised"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["order", "route", "travel-plan"]
      - app: sock-shop
        fit: possible
        candidate_targets: ["orders", "payment", "shipping"]
    observable_evidence:
      metrics: ["executor queue depth", "CPU usage", "request rate after client abort", "live request latency"]
      traces: ["orphan local spans", "work spans without completed parent request"]
      logs: ["client closed connection", "task completed after cancellation"]
      kubernetes: ["CPU throttling", "pod restart only if resource pressure escalates"]
      source: ["future/task without cancellation hook", "loops ignoring cancellation checks"]
    recovery:
      cleanup: ["stop abort workload", "wait for queue drain"]
      verification: ["worker queue returns to baseline", "no lingering high CPU after workload stops"]
    leakage_controls:
      agent_visible: true
      public_hints: ["cancellation-related resilience class"]
      forbidden_disclosures: ["hidden service", "exact async task name"]
      answer_leakage_risks: ["benchmark-specific log message"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-004
    title: Timeout budget inversion
    status: candidate
    family: timeout
    summary: Inner calls have longer timeout budgets than the outer user-facing request.
    latent_defect:
      description: A downstream timeout exceeds the remaining upstream deadline.
      mechanism: The outer request fails first while inner resources remain occupied until their longer timeout expires.
      likely_locations: ["client timeout constants", "service config", "retry policy", "RPC wrapper"]
      risk_conditions: ["short gateway timeout", "long dependency timeout", "burst traffic", "limited worker pool"]
    fault_trigger:
      trigger_class: latency
      actuator_candidates: ["network delay", "dependency slow response"]
      parameters: ["dependency delay below inner timeout", "duration window", "request path"]
      guardrails: ["single dependency", "no permanent dependency outage", "hard max duration"]
    failure_outcome:
      slo_impact: Outer SLO fails while resource occupancy persists past user-visible failure.
      user_visible_symptom: User sees quick failure followed by prolonged degraded throughput.
      expected_degradation: Parent spans end before child spans, and active requests remain elevated.
      invalid_outcomes: ["inner timeout shorter than parent", "no observable request pressure"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["gateway", "order", "seat", "payment"]
      - app: otel-demo
        fit: secondary
        candidate_targets: ["frontend", "checkoutservice", "paymentservice"]
    observable_evidence:
      metrics: ["outer timeout rate", "downstream active calls", "latency quantiles"]
      traces: ["child duration exceeds remaining parent budget"]
      logs: ["gateway timeout followed by downstream completion"]
      kubernetes: ["steady readiness despite failing SLO"]
      source: ["timeout constants that exceed caller budget", "policy files with inverted deadlines"]
    recovery:
      cleanup: ["remove latency trigger", "wait at least one inner timeout period"]
      verification: ["active calls drain", "SLO recovers without restart"]
    leakage_controls:
      agent_visible: true
      public_hints: ["budget ordering defect"]
      forbidden_disclosures: ["exact timeout values of hidden case", "patch line"]
      answer_leakage_risks: ["config key names that include defect id"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-005
    title: Layered retries without a global budget
    status: candidate
    family: retry
    summary: Multiple layers retry the same failing operation and multiply downstream load.
    latent_defect:
      description: Gateway, service client, SDK, and database layers retry independently.
      mechanism: A small dependency error fan-outs into a retry storm that delays healthy traffic.
      likely_locations: ["HTTP clients", "service mesh retry policy", "SDK config", "database driver"]
      risk_conditions: ["transient dependency error", "high request rate", "non-shared retry budget"]
    fault_trigger:
      trigger_class: http_error
      actuator_candidates: ["HTTP abort", "dependency unavailable", "packet loss"]
      parameters: ["error ratio", "target dependency", "duration window"]
      guardrails: ["cap error ratio", "one dependency", "stop on downstream saturation"]
    failure_outcome:
      slo_impact: Downstream request volume increases beyond offered load and causes wider SLO failure.
      user_visible_symptom: Users see cascading errors even when the initial fault is partial.
      expected_degradation: Request attempts per user operation exceed the configured budget.
      invalid_outcomes: ["no retry policy active", "all traffic is blocked before retries occur"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["order", "ticketinfo", "payment", "gateway"]
      - app: sock-shop
        fit: secondary
        candidate_targets: ["front-end", "orders", "payment"]
      - app: otel-demo
        fit: possible
        candidate_targets: ["frontend", "checkoutservice"]
    observable_evidence:
      metrics: ["retry count", "downstream RPS greater than ingress RPS", "error rate", "latency"]
      traces: ["repeated child spans for one logical operation"]
      logs: ["retry attempt", "temporary failure", "max retries exceeded"]
      kubernetes: ["CPU/network pressure on target dependency"]
      source: ["nested retry decorators", "SDK default retry enabled plus caller retry"]
    recovery:
      cleanup: ["remove error trigger", "wait for retry backlog to stop"]
      verification: ["attempt ratio returns near one", "downstream saturation clears"]
    leakage_controls:
      agent_visible: true
      public_hints: ["retry amplification class"]
      forbidden_disclosures: ["exact layer combination", "hidden retry constants"]
      answer_leakage_risks: ["logs that print injected case id"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-006
    title: Retries without exponential backoff and jitter
    status: candidate
    family: retry
    summary: Clients retry immediately or on the same fixed interval after transient failure.
    latent_defect:
      description: Retry policy lacks exponential backoff, jitter, or a shared retry throttle.
      mechanism: Synchronized retry waves overload the recovering dependency.
      likely_locations: ["retry policy", "client wrapper", "message consumer retry loop"]
      risk_conditions: ["temporary outage", "many concurrent clients", "dependency recovery window"]
    fault_trigger:
      trigger_class: dependency_unavailable
      actuator_candidates: ["short dependency outage", "HTTP error burst", "process kill"]
      parameters: ["outage duration", "client concurrency", "retry window"]
      guardrails: ["short outage", "single target", "watch retry volume"]
    failure_outcome:
      slo_impact: Recovery is delayed by synchronized retry traffic after the initial outage ends.
      user_visible_symptom: Errors continue after the dependency is healthy enough to serve normal load.
      expected_degradation: Periodic request spikes align with retry intervals.
      invalid_outcomes: ["retry disabled", "dependency never recovers during episode"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["order", "preserve", "payment"]
      - app: sock-shop
        fit: secondary
        candidate_targets: ["orders", "carts", "payment"]
    observable_evidence:
      metrics: ["retry attempts over time", "dependency RPS burst pattern", "post-recovery latency"]
      traces: ["clustered repeat attempts with uniform spacing"]
      logs: ["retry sleep interval", "attempt number"]
      kubernetes: ["target pod CPU spikes after recovery"]
      source: ["fixed sleep retry loop", "missing jitter in retry config"]
    recovery:
      cleanup: ["restore dependency", "allow retry wave to decay"]
      verification: ["burst pattern disappears", "error rate returns to baseline"]
    leakage_controls:
      agent_visible: true
      public_hints: ["backoff and jitter class"]
      forbidden_disclosures: ["exact interval", "specific file in locked task"]
      answer_leakage_risks: ["source constant named NO_JITTER"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-007
    title: Permanent errors are retried
    status: candidate
    family: retry
    summary: The system retries validation, authorization, or other permanent errors that should fail fast.
    latent_defect:
      description: Retry predicates do not distinguish transient failures from deterministic permanent failures.
      mechanism: Bad requests consume resources repeatedly without any chance of success.
      likely_locations: ["retry predicate", "HTTP status classifier", "exception mapping", "consumer error handling"]
      risk_conditions: ["invalid input burst", "misclassified 4xx", "limited worker pool"]
    fault_trigger:
      trigger_class: workload_spike
      actuator_candidates: ["invalid request workload", "synthetic 4xx response"]
      parameters: ["bad request ratio", "request rate", "duration window"]
      guardrails: ["use non-destructive invalid operations", "bounded traffic", "no real customer data"]
    failure_outcome:
      slo_impact: Healthy requests slow down because permanent failures consume retry capacity.
      user_visible_symptom: Users with valid requests see elevated latency or errors during invalid-input bursts.
      expected_degradation: Multiple attempts are emitted for requests that return deterministic validation errors.
      invalid_outcomes: ["input accepted as valid", "retry attempts not observable"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["order", "user", "payment"]
      - app: sock-shop
        fit: secondary
        candidate_targets: ["front-end", "orders", "user"]
    observable_evidence:
      metrics: ["retry count by status", "4xx rate", "valid request latency"]
      traces: ["same bad request repeated", "validation error spans retried"]
      logs: ["validation failed followed by retry", "permanent error classified as retryable"]
      kubernetes: ["worker CPU increases without successful completions"]
      source: ["retry on broad exception", "HTTP status classifier includes 4xx"]
    recovery:
      cleanup: ["stop invalid workload", "verify retry backlog cleared"]
      verification: ["valid request SLO recovers", "no repeated attempts for validation errors"]
    leakage_controls:
      agent_visible: true
      public_hints: ["retry predicate class"]
      forbidden_disclosures: ["exact invalid input field", "hidden classifier branch"]
      answer_leakage_risks: ["test data names that reveal expected answer"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-008
    title: Non-idempotent operation retried
    status: candidate
    family: retry
    summary: A mutating operation is retried without an idempotency key or deduplication guard.
    latent_defect:
      description: Create, charge, reserve, or submit operations can execute more than once for one user intent.
      mechanism: A lost response or transient error makes the caller retry and duplicate the side effect.
      likely_locations: ["order creation", "payment", "reservation", "message producer"]
      risk_conditions: ["response loss", "timeout after commit", "at-least-once retry", "no idempotency key"]
    fault_trigger:
      trigger_class: packet_loss
      actuator_candidates: ["response packet loss", "HTTP timeout after side effect", "dependency latency"]
      parameters: ["loss ratio", "operation endpoint", "duration window"]
      guardrails: ["use synthetic test account", "bounded request count", "cleanup test data"]
    failure_outcome:
      slo_impact: Correctness SLO fails because one user action creates duplicate state.
      user_visible_symptom: User sees duplicate orders, reservations, payments, or messages.
      expected_degradation: Duplicate committed entities share the same logical request intent.
      invalid_outcomes: ["operation is read-only", "test data cannot be isolated", "dedupe key present and active"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["order", "preserve", "payment"]
      - app: sock-shop
        fit: primary
        candidate_targets: ["orders", "payment"]
      - app: otel-demo
        fit: possible
        candidate_targets: ["checkoutservice", "paymentservice"]
    observable_evidence:
      metrics: ["duplicate create count", "operation retries", "success count greater than unique intents"]
      traces: ["timeout followed by successful repeated mutation"]
      logs: ["created entity", "retry after timeout", "missing idempotency key"]
      kubernetes: ["no pod failure required; correctness failure appears in app state"]
      source: ["mutation endpoint lacks idempotency key", "retry wraps non-idempotent call"]
    recovery:
      cleanup: ["remove test duplicate records where supported", "stop packet loss"]
      verification: ["no further duplicates for new test intents", "system returns to healthy baseline"]
    leakage_controls:
      agent_visible: true
      public_hints: ["non-idempotent retry class"]
      forbidden_disclosures: ["exact entity id", "hidden database table", "patch diff"]
      answer_leakage_risks: ["fixture names that encode duplicate-order answer"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-009
    title: Missing or misconfigured circuit breaker
    status: candidate
    family: isolation
    summary: Calls continue to a failing dependency instead of opening a circuit and degrading.
    latent_defect:
      description: Circuit breaker is absent, too permissive, or scoped incorrectly for a dependency.
      mechanism: Upstream services keep spending resources on calls that are very likely to fail.
      likely_locations: ["resilience policy config", "client wrapper", "service mesh policy"]
      risk_conditions: ["dependency error burst", "slow failure", "shared thread pool"]
    fault_trigger:
      trigger_class: http_error
      actuator_candidates: ["dependency HTTP errors", "connection refusal", "process kill"]
      parameters: ["error ratio", "breaker window", "target dependency"]
      guardrails: ["short trigger", "single dependency", "observe fallback path"]
    failure_outcome:
      slo_impact: Unrelated or fallback-capable requests violate SLO because the circuit never protects capacity.
      user_visible_symptom: Users see slow hard failures instead of fast fallback or partial response.
      expected_degradation: Erroring dependency continues receiving calls after threshold is exceeded.
      invalid_outcomes: ["no fallback expected for this path", "breaker opens as designed"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["travel-plan", "route", "ticketinfo"]
      - app: otel-demo
        fit: secondary
        candidate_targets: ["frontend", "recommendationservice"]
    observable_evidence:
      metrics: ["circuit state", "calls to failing dependency", "fallback count", "latency"]
      traces: ["continued failing child spans after threshold"]
      logs: ["connection failure without circuit open", "fallback not used"]
      kubernetes: ["target dependency unhealthy or erroring"]
      source: ["missing circuit breaker wrapper", "threshold too high", "wrong exception classification"]
    recovery:
      cleanup: ["restore dependency", "wait for breaker state if present"]
      verification: ["failing-call volume returns to baseline", "fallback metrics normalize"]
    leakage_controls:
      agent_visible: true
      public_hints: ["circuit breaker class"]
      forbidden_disclosures: ["exact dependency", "configured hidden threshold"]
      answer_leakage_risks: ["dashboard panel named after target answer"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-010
    title: Missing bulkhead between request classes
    status: candidate
    family: isolation
    summary: Slow or failing low-priority work consumes the same pool needed by critical requests.
    latent_defect:
      description: Critical and non-critical operations share thread, connection, queue, or semaphore capacity.
      mechanism: Degraded background or optional work starves the user-facing path.
      likely_locations: ["executor pool", "database pool", "HTTP client pool", "queue consumer"]
      risk_conditions: ["optional dependency slowdown", "traffic mix", "small shared pool"]
    fault_trigger:
      trigger_class: latency
      actuator_candidates: ["optional dependency delay", "workload spike"]
      parameters: ["slow path target", "critical path workload", "duration window"]
      guardrails: ["do not block all dependencies", "keep critical workload measurable", "bounded duration"]
    failure_outcome:
      slo_impact: Critical operation SLO fails even though its direct dependencies are healthy.
      user_visible_symptom: Core user action slows because unrelated optional work is stuck.
      expected_degradation: Shared pool saturation correlates with optional-path slowdown.
      invalid_outcomes: ["critical path depends directly on the slowed dependency", "separate pools already active"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["travel-plan", "notification", "food", "order"]
      - app: otel-demo
        fit: secondary
        candidate_targets: ["frontend", "recommendationservice", "adservice"]
    observable_evidence:
      metrics: ["pool utilization", "queue depth", "critical request latency", "optional request latency"]
      traces: ["critical spans waiting before unrelated dependency call"]
      logs: ["executor rejected", "pool wait timeout", "queue full"]
      kubernetes: ["single pod resource pressure despite healthy direct dependency"]
      source: ["shared executor definition", "shared client pool across request classes"]
    recovery:
      cleanup: ["remove optional dependency delay", "wait for shared pool queue drain"]
      verification: ["critical SLO recovers", "pool utilization normalizes"]
    leakage_controls:
      agent_visible: true
      public_hints: ["bulkhead/isolation class"]
      forbidden_disclosures: ["exact shared pool name", "hidden critical path"]
      answer_leakage_risks: ["metrics label with benchmark case id"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-011
    title: Unbounded queue or concurrency
    status: candidate
    family: capacity
    summary: The service accepts more work than it can finish and stores backlog without a practical bound.
    latent_defect:
      description: Work queues, goroutines, futures, or request buffers are unbounded or bounded above pod capacity.
      mechanism: Overload turns into memory growth, long tail latency, and delayed failure instead of controlled shedding.
      likely_locations: ["executor queue", "channel/buffer", "web server queue", "async event queue"]
      risk_conditions: ["traffic spike", "slow downstream", "limited memory", "no admission control"]
    fault_trigger:
      trigger_class: workload_spike
      actuator_candidates: ["request burst", "dependency latency", "consumer slowdown"]
      parameters: ["burst RPS", "burst duration", "target endpoint"]
      guardrails: ["cap total requests", "monitor memory", "stop before node pressure"]
    failure_outcome:
      slo_impact: Latency SLO fails and the pod may restart due to memory pressure or backlog.
      user_visible_symptom: Requests are accepted but complete too late or fail after long waits.
      expected_degradation: Queue length and memory grow instead of immediate controlled rejection.
      invalid_outcomes: ["admission control rejects early", "load generator cannot reach target"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["order", "route", "travel-plan"]
      - app: sock-shop
        fit: secondary
        candidate_targets: ["front-end", "orders", "carts"]
    observable_evidence:
      metrics: ["queue depth", "memory usage", "request latency", "rejection count"]
      traces: ["long server wait before business logic"]
      logs: ["out of memory", "queue full absent", "request completed after long delay"]
      kubernetes: ["OOMKilled", "restarts", "memory usage near limit"]
      source: ["unbounded executor queue", "goroutine per request", "buffer without limit"]
    recovery:
      cleanup: ["stop burst workload", "restart only if allowed by reset contract"]
      verification: ["queue drains", "memory returns to baseline", "pod Ready state stable"]
    leakage_controls:
      agent_visible: true
      public_hints: ["capacity control class"]
      forbidden_disclosures: ["exact queue field", "hidden endpoint"]
      answer_leakage_risks: ["source comment describing benchmark overload"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-012
    title: Missing load shedding or rate limit
    status: candidate
    family: capacity
    summary: The system keeps accepting new requests when it should reject or degrade early.
    latent_defect:
      description: No admission control protects critical resources under overload.
      mechanism: Work enters the system faster than it can complete, causing collapse instead of bounded failure.
      likely_locations: ["gateway", "front-end service", "worker admission path", "queue producer"]
      risk_conditions: ["high burst traffic", "slow dependency", "shared pool", "no priority classes"]
    fault_trigger:
      trigger_class: workload_spike
      actuator_candidates: ["traffic burst", "slow dependency plus normal load"]
      parameters: ["burst RPS", "SLO threshold", "duration window"]
      guardrails: ["controlled synthetic workload", "namespace-local target", "stop on safety threshold"]
    failure_outcome:
      slo_impact: Both latency and error SLOs degrade more than a controlled 429/503 strategy would allow.
      user_visible_symptom: Users see long waits and cascading failures instead of quick retryable rejection.
      expected_degradation: Rejection metrics stay low while latency and saturation grow.
      invalid_outcomes: ["rate limiter actively rejects overload", "traffic below capacity"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["gateway", "order", "travel"]
      - app: sock-shop
        fit: primary
        candidate_targets: ["front-end", "orders"]
      - app: otel-demo
        fit: secondary
        candidate_targets: ["frontend"]
    observable_evidence:
      metrics: ["ingress RPS", "latency", "rejection rate", "CPU", "queue depth"]
      traces: ["many slow full-path traces instead of fast rejection"]
      logs: ["no rate-limit decision during overload", "request timed out"]
      kubernetes: ["CPU throttling", "HPA lag if present"]
      source: ["missing limiter middleware", "disabled admission control"]
    recovery:
      cleanup: ["stop overload workload", "wait for queues to drain"]
      verification: ["latency and saturation return to baseline", "no active trigger remains"]
    leakage_controls:
      agent_visible: true
      public_hints: ["load shedding class"]
      forbidden_disclosures: ["exact gateway route", "hidden limit value"]
      answer_leakage_risks: ["workload name that reveals endpoint"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-013
    title: Fanout all-or-nothing without degradation
    status: candidate
    family: isolation
    summary: A fanout request fails completely when one optional branch is slow or unavailable.
    latent_defect:
