  - schema_version: defect-spec.v0.1
    defect_id: RBD-026
    title: Poison message has no dead-letter path
    status: candidate
    family: messaging
    summary: One unprocessable message blocks or repeatedly crashes a consumer.
    latent_defect:
      description: Consumer retry has no max-attempt policy, dead-letter queue, or quarantine path.
      mechanism: A deterministic bad message monopolizes the consumer and prevents healthy messages from progressing.
      likely_locations: ["consumer error loop", "broker policy", "deserializer", "message validation"]
      risk_conditions: ["malformed message", "strict parser", "ordered queue", "no DLQ"]
    fault_trigger:
      trigger_class: message_poison
      actuator_candidates: ["inject malformed synthetic message", "bad payload replay"]
      parameters: ["message type", "payload shape", "queue"]
      guardrails: ["synthetic queue/entity", "bounded poison count", "remove poison message during cleanup"]
    failure_outcome:
      slo_impact: Event-processing SLO fails as healthy messages lag behind the poison message.
      user_visible_symptom: User-facing state stops updating or notifications stop.
      expected_degradation: Consumer retries the same message repeatedly and queue lag grows.
      invalid_outcomes: ["DLQ catches poison message", "consumer skips invalid message as designed"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["RabbitMQ consumers", "order events", "notification events"]
      - app: sock-shop
        fit: primary
        candidate_targets: ["queue-master", "orders"]
    observable_evidence:
      metrics: ["consumer lag", "redelivery count", "DLQ count", "healthy message delay"]
      traces: ["repeated consumer spans for same malformed message"]
      logs: ["deserialization error repeated", "message rejected and redelivered"]
      kubernetes: ["consumer crash loop if exception escapes", "broker queue depth"]
      source: ["retry forever", "no dead-letter policy", "unhandled parser exception"]
    recovery:
      cleanup: ["remove or dead-letter poison message", "restart consumer only if reset contract allows"]
      verification: ["queue drains", "consumer processes healthy messages"]
    leakage_controls:
      agent_visible: true
      public_hints: ["poison message class"]
      forbidden_disclosures: ["exact queue", "hidden poison payload"]
      answer_leakage_risks: ["public payload fixture with answer name"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-027
    title: Rolling upgrade contract drift
    status: candidate
    family: compatibility
    summary: Mixed service versions are temporarily incompatible during a rolling update.
    latent_defect:
      description: API, schema, or shared library changes are not backward and forward compatible.
      mechanism: Old and new pods exchange payloads or database state they cannot both understand.
      likely_locations: ["API DTO", "database migration", "protobuf/schema", "shared client library"]
      risk_conditions: ["rolling deploy", "mixed versions", "required field change", "non-expand-contract migration"]
    fault_trigger:
      trigger_class: config_rollout
      actuator_candidates: ["rolling update", "partial config rollout", "schema migration toggle"]
      parameters: ["version mix", "traffic path", "rollout duration"]
      guardrails: ["use test image or config", "rollback available", "bounded rollout"]
    failure_outcome:
      slo_impact: Requests fail only while versions are mixed, proving deployment-time resilience defect.
      user_visible_symptom: Users see intermittent errors during rollout.
      expected_degradation: Errors correlate with cross-version caller/callee pairs or migrated fields.
      invalid_outcomes: ["full restart only with no mixed traffic", "schema compatible across versions"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["shared DTO services", "order", "travel", "payment"]
      - app: otel-demo
        fit: secondary
        candidate_targets: ["frontend", "checkoutservice", "cartservice"]
    observable_evidence:
      metrics: ["error rate by version", "rollout progress", "schema validation failures"]
      traces: ["failed calls where caller and callee versions differ"]
      logs: ["unknown field", "deserialization error", "migration error"]
      kubernetes: ["ReplicaSet versions", "rollout status", "pod labels"]
      source: ["non-compatible DTO change", "migration not expand-contract", "shared library lockstep"]
    recovery:
      cleanup: ["complete rollback or rollout according to reset contract", "restore stable version"]
      verification: ["single compatible version active", "error rate baseline"]
    leakage_controls:
      agent_visible: true
      public_hints: ["rolling compatibility class"]
      forbidden_disclosures: ["exact schema field", "hidden version pair"]
      answer_leakage_risks: ["image tag that includes defect name"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-028
    title: Cache is an incorrect hard dependency
    status: candidate
    family: caching
    summary: Cache outage fails the request even though the source of truth is still available.
    latent_defect:
      description: Application treats cache read/write failure as fatal on a path where degradation is possible.
      mechanism: Optional acceleration becomes a single point of failure.
      likely_locations: ["cache client wrapper", "repository layer", "session/cache middleware"]
      risk_conditions: ["cache outage", "source database healthy", "no fallback or stale read"]
    fault_trigger:
      trigger_class: dependency_unavailable
      actuator_candidates: ["cache service unavailable", "network block to cache", "cache process kill"]
      parameters: ["cache target", "request path", "duration window"]
      guardrails: ["cache only", "preserve source database", "bounded outage"]
    failure_outcome:
      slo_impact: Availability SLO fails because cache failure blocks otherwise servable requests.
      user_visible_symptom: Users see hard errors instead of slower source-of-truth responses.
      expected_degradation: Requests fail at cache access while database or backing service remains healthy.
      invalid_outcomes: ["cache is authoritative by product contract", "fallback works with acceptable latency"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["route cache", "ticketinfo cache", "user session cache"]
      - app: sock-shop
        fit: secondary
        candidate_targets: ["catalogue", "carts", "session"]
      - app: otel-demo
        fit: possible
        candidate_targets: ["cartservice cache if configured"]
    observable_evidence:
      metrics: ["cache error rate", "database health", "request availability", "fallback count"]
      traces: ["failed cache span with no fallback source call"]
      logs: ["cache connection failed", "request aborted due to cache error"]
      kubernetes: ["cache pod/service health", "application pods ready"]
      source: ["cache exception propagated", "no fallback to source", "cache write failure fails request"]
    recovery:
      cleanup: ["restore cache connectivity", "allow cache reconnect"]
      verification: ["requests succeed", "cache error rate baseline"]
    leakage_controls:
      agent_visible: true
      public_hints: ["cache dependency class"]
      forbidden_disclosures: ["exact cache key/path", "hidden fallback contract"]
      answer_leakage_risks: ["source comment saying cache outage benchmark"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-029
    title: Cache stampede or cold-start amplification
    status: candidate
    family: caching
    summary: Concurrent cache misses or synchronized expiry overload the backing service.
    latent_defect:
      description: Cache misses are not coalesced and cache entries expire at the same time without jitter.
      mechanism: Many callers rebuild the same value concurrently and overload the source dependency.
      likely_locations: ["cache loader", "TTL configuration", "startup warmup", "repository layer"]
      risk_conditions: ["cache flush", "synchronized TTL", "high concurrency", "expensive backing query"]
    fault_trigger:
      trigger_class: cache_flush
      actuator_candidates: ["cache flush", "pod restart with cold cache", "TTL expiry workload"]
      parameters: ["key group", "concurrency", "warmup window"]
      guardrails: ["bounded key set", "synthetic or read-only workload", "monitor backing service"]
    failure_outcome:
      slo_impact: Latency/error SLO fails immediately after cache flush or synchronized expiry.
      user_visible_symptom: Users see slow reads or errors during cache warmup.
      expected_degradation: Backing service query volume spikes far above unique key count.
      invalid_outcomes: ["request coalescing active", "cache cannot be flushed in episode"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["route", "ticketinfo", "travel-plan"]
      - app: sock-shop
        fit: primary
        candidate_targets: ["catalogue", "carts"]
      - app: otel-demo
        fit: possible
        candidate_targets: ["productcatalogservice", "cartservice"]
    observable_evidence:
      metrics: ["cache hit ratio", "backing query RPS", "latency", "error rate"]
      traces: ["many identical backing-service spans after cache miss"]
      logs: ["cache miss", "recompute", "backing query timeout"]
      kubernetes: ["backing service CPU and connection pressure"]
      source: ["no singleflight/request coalescing", "fixed TTL without jitter"]
    recovery:
      cleanup: ["stop cache flush trigger", "allow cache warmup"]
      verification: ["hit ratio recovers", "backing query RPS baseline"]
    leakage_controls:
      agent_visible: true
      public_hints: ["cache stampede class"]
      forbidden_disclosures: ["exact key group", "hidden cache loader"]
      answer_leakage_risks: ["load script named stampede-answer"]

  - schema_version: defect-spec.v0.1
    defect_id: RBD-030
    title: Stale service discovery or DNS dependency
    status: candidate
    family: discovery
    summary: Clients keep using stale endpoints or fail hard when DNS/service discovery is briefly impaired.
    latent_defect:
      description: Connection reuse, DNS caching, or discovery refresh policy ignores endpoint churn or resolver failure.
      mechanism: Clients call removed pods or cannot recover promptly from a short discovery fault.
      likely_locations: ["HTTP client connection pool", "DNS resolver config", "service registry client", "gRPC channel"]
      risk_conditions: ["pod rollout", "endpoint change", "DNS latency/failure", "long-lived connections"]
    fault_trigger:
      trigger_class: dns_fault
      actuator_candidates: ["DNS delay/error", "pod restart with endpoint churn", "service registry outage"]
      parameters: ["resolver fault duration", "target service", "connection lifetime"]
      guardrails: ["short resolver fault", "namespace-local target if possible", "avoid cluster-wide DNS blast radius"]
    failure_outcome:
      slo_impact: Requests fail after endpoint churn or brief resolver fault longer than the trigger window.
      user_visible_symptom: Users see intermittent connection errors or stale-target failures.
      expected_degradation: Client continues sending traffic to dead endpoint or fails to refresh discovery.
      invalid_outcomes: ["client refreshes endpoints promptly", "fault affects whole cluster outside scope"]
    app_candidates:
      - app: train-ticket
        fit: primary
        candidate_targets: ["service-registry clients", "gateway", "order"]
      - app: sock-shop
        fit: secondary
        candidate_targets: ["front-end", "orders", "catalogue"]
      - app: otel-demo
        fit: secondary
        candidate_targets: ["frontend", "checkoutservice"]
    observable_evidence:
      metrics: ["DNS error rate", "connection refused", "endpoint update count", "request errors"]
      traces: ["client errors to stale endpoint", "resolver span failures if instrumented"]
      logs: ["no such host", "connection refused", "stale endpoint", "resolver timeout"]
      kubernetes: ["endpoint slices", "pod IP churn", "CoreDNS metrics where allowed"]
      source: ["long DNS TTL", "static endpoint cache", "connection pool without idle eviction"]
    recovery:
      cleanup: ["remove DNS/discovery fault", "wait for client refresh interval"]
      verification: ["client calls current endpoints", "resolver errors baseline", "SLO recovers"]
    leakage_controls:
      agent_visible: true
      public_hints: ["service discovery class"]
      forbidden_disclosures: ["exact endpoint", "hidden resolver configuration"]
      answer_leakage_risks: ["case-specific service name embedded in prompt"]
