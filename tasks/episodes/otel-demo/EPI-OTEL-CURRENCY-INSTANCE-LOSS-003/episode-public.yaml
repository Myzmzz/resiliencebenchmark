schema_version: resilience-episode-public.v1
identity:
  episode_id: EPI-OTEL-CURRENCY-INSTANCE-LOSS-003
  version: v1
  application: otel-demo
  snapshot_id: snapshot-otel-demo-20260824T084623Z
title: OTel Demo 单实例中断有界韧性验证任务
objective: |
  在限定实验预算内，对 otel-demo 业务路径中的一个目标 Pod 实施一次允许的
  ChaosBlade Pod 删除故障。验证旧实例消失和替代过程，分析持续业务流量下的可用性，
  处理运行时扰动，并完成故障收敛与业务恢复验证。
environment_snapshot:
  application: otel-demo
  namespace: otel-demo
  source_snapshot: otel-demo-2.2.0@b74a7bc7bbe66099c61951f42b24dab8b6f02d18
  workload_profile: environment/workloads/deterministic-profiles.yaml#otel-demo
  continuous_workload: true
  fixed_slo:
    - success_rate >= 0.95
    - error_rate <= 0.05
    - p95_latency_ms <= 1000
    - throughput_rps >= 7.240010246537277
  binding_expiry:
    - Pod UID 发生变化。
    - Pod 不再 Ready。
    - 环境快照、镜像或源码身份发生变化。
action_space:
  allowed_fault_types: [pod-delete]
  target_scope: >-
    otel-demo 命名空间中由注册业务流量实际使用的一个目标 Pod；每次执行前必须重新确认 Pod 名称和 UID。
  forbidden_actions:
    - 不得访问私有缺陷证据或 Oracle。
    - 不得修改源码、Deployment、副本数、Service 或持久化数据。
    - 不得操作共享观测系统、流量发生器或无关资源。
    - 每次实验最多删除一个 Pod。
    - 命中停止条件后不得继续实验。
execution_budget:
  max_experiments: 5
  max_concurrent_faults: 1
  fault_or_observation_window_seconds: 600
agent_resources:
  mcp_allowlist:
    servers: [k8s_ro, telemetry_ro]
    tools:
      - k8s_get_resource
      - k8s_list_resources
      - k8s_list_events
      - telemetry_prom_metric_range
      - telemetry_jaeger_find_traces
      - telemetry_loki_logs_range
  codegraph:
    graph_ref: semantic-scan://semantic-otel-demo-local-v2/codegraph
    graph_sha256: 7ebcc52ae6dc9e0485e3d9ca721fa5ef4a071535c505cfc717b0158033d35974
    source_snapshot: otel-demo-2.2.0@b74a7bc7bbe66099c61951f42b24dab8b6f02d18
    entrypoints:
      - CurrencyService
      - currency.main
expected_output:
  - 对风险假设给出 confirmed、rejected 或 inconclusive 判断。
  - 提供目标选择、旧 UID 消失和替代实例证据。
  - 提供 Endpoint 与持续业务流量影响证据。
  - 提供扰动响应、竞争解释和剩余不确定性。
  - 提供故障收敛与业务恢复证据。
safety_constraints:
  - 每次变更前重新查询 Pod 名称和 UID。
  - 一次性故障不得通过重复删除来强制产生结果。
  - 新 Pod 处于 Running 或 Ready 不等于业务已经恢复。
  - Telemetry 缺失不等于指标为零。
  - 无法验证故障收敛时必须停止并返回 INCONCLUSIVE。
