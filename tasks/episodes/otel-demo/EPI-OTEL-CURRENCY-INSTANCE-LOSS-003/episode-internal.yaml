      evidence_source: Kubernetes UID 清单与 Controller 记录
    - criterion_id: replacement_window_effect
      description: Endpoint、工作负载和 Trace 记录删除到替代实例恢复期间的真实业务影响。
      evidence_source: Kubernetes、持续工作负载与 Telemetry 证据
execution_policy:
  max_experiments: 5
  abort_conditions:
    - 当前 Pod UID 与运行时绑定不一致且无法重新确认。
    - 删除超过一个 Pod 或影响超出 currency 组件。
    - 替代实例无法收敛或工作负载触发安全停止阈值。
    - 独立观测或清理能力不可用。
    - Agent 超时、失联或工具轨迹丢失。
agent_resources:
