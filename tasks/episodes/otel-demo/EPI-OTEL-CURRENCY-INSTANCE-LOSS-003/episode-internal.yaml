defect_basis:
  template_id: RD-14
  defect_name: 单副本与中断保护缺失候选
  evidence_description: >-
    源码快照中的 Service/currency 选择 currency 工作负载，Deployment/currency 声明一个副本，
    CodeGraph 将该工作负载关联到 CurrencyService 业务实现。2026-08-24 的只读现场检查也显示
    replicas=1、readyReplicas=1 且命名空间中没有 PDB；但客户端重试、缓存和替代容量仍需实验区分。
  evidence:
    - evidence_id: EV-9975E981AF65
      kind: kubernetes_manifest
      statement: 源码锁定清单中的 Service/currency 选择 currency 工作负载。
      path: kubernetes/opentelemetry-demo.yaml
      symbol: Service/currency
      source_hash: 4539b80579493f5d189207dad8b140b9553350f6505e81cb0d632410d5275acd
    - evidence_id: EV-8E96794F07BA
      kind: kubernetes_manifest
      statement: 源码锁定清单中的 Deployment/currency 声明单副本且未声明跨拓扑保护。
      path: kubernetes/opentelemetry-demo.yaml
      symbol: Deployment/currency
      source_hash: 8fe3b4cf09407440de4363b642239838641c0cd4ff022f162d522caa6d3528f2
    - evidence_id: EV-20947957CDE5
      kind: codegraph_node
      statement: CodeGraph 在 currency 源码中定位到 CurrencyService 业务服务实现。
      path: src/currency/src/server.cpp
      start_line: 103
      end_line: 237
      symbol: CurrencyService
      source_hash: 14d421ccace202d0cf890e57500f8e2fe990d4af36817110f3ad40fe7d3a547f
    - evidence_id: EV-1ACE3143A965
      kind: codegraph_node
      statement: currency 进程 main 入口注册并运行 CurrencyService。
      path: src/currency/src/server.cpp
      start_line: 267
      end_line: 284
      symbol: main
      source_hash: 349734be707044b5c33e9157f6bff4911244437ec846882d27a9219f24f03261
  mechanism_chain:
    - order: 1
      cause: Service/currency 将业务请求路由到 currency 工作负载。
      relation: selects
      effect: currency RPC 依赖该 Deployment 的可用 Pod。
      evidence_ids: [EV-9975E981AF65, EV-20947957CDE5]
    - order: 2
      cause: Deployment/currency 只声明一个副本。
      relation: limits_capacity
      effect: 当前唯一 Pod 消失时可能暂时没有等价 Ready Endpoint。
      evidence_ids: [EV-8E96794F07BA]
    - order: 3
      cause: Pod 删除到替代 Pod Ready 之间出现容量空窗。
      relation: may_interrupt
      effect: currency 相关的浏览、购物车或结算请求可能失败或等待。
      evidence_ids: [EV-9975E981AF65, EV-8E96794F07BA, EV-1ACE3143A965]
    - order: 4
      cause: 持续入口流量穿过该容量空窗。
      relation: may_violate
      effect: 成功率、延迟或吞吐可能违反固定 SLO。
      evidence_ids: [EV-9975E981AF65, EV-20947957CDE5]
  supported_fault_types: [pod-delete, pod-fail]
  injection_component: currency
  confidence: 0.45
  confidence_level: low
  residual_hypotheses:
    - 客户端重试或缓存可能完全吸收替代窗口。
    - 运行时可能存在清单之外的等价容量或流量保护。
    - 混合工作负载可能没有足够密度的 currency 相关请求。
