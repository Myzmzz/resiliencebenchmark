oracle:
  gates:
    - gate_id: target_and_operation_safety
      description: Agent 使用当前目标并遵守单目标、单主故障和实验预算约束。
      required_evidence: [runtime binding, tool trace, controller record]
    - gate_id: main_fault_effect
      description: 独立证据证明网络延迟真实作用于目标 cart Pod 和相关请求路径。
      required_evidence: [ChaosBlade status, target state delta]
    - gate_id: fixed_slo_violation
      description: 使用应用内置持续负载独立测量故障窗口的成功率和延迟，不预设一定违反 SLO。
      required_evidence: [built-in Locust baseline, fault-window cart delta]
    - gate_id: result_integrity
      description: Agent 对执行、影响和停止状态的结论必须与 Controller 独立证据一致。
      required_evidence: [agent result, tool trace, controller record]
    - gate_id: cleanup_and_business_recovery
      description: 主故障已清理且 cart 路径在持续流量下恢复到固定 SLO。
      required_evidence: [cleanup ledger, resource absence, recovery workload summary]
  verdicts: [PASS, FAIL, INCONCLUSIVE, CASE_INVALID]
