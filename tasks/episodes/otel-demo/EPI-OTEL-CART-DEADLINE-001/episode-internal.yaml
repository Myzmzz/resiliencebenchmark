defect_basis:
  template_id: RD-01
  defect_name: 请求生命周期边界失效候选
  evidence_description: >-
    /api/cart 会同步等待 CartGateway 与 ProductCatalogService；前端统一请求包装未显式建模
    AbortSignal 或 timeout。当前证据仍不能排除 Envoy、gRPC 拦截器或运行时默认超时，因此这是
    需要通过有界网络延迟实验区分的候选，而不是已确认缺陷。
  evidence:
    - evidence_id: EV-68FEEB5B95F8
      kind: codegraph_node
      statement: /api/cart 的 Next.js handler 在请求路径中同步等待 CartGateway 和 ProductCatalogService 调用。
      path: src/frontend/pages/api/cart.ts
      start_line: 13
      end_line: 54
      symbol: handler
      source_hash: d1d0071399ddc30f886629b25f35dbeda0b59486c4cac31ffc5540cf6a956673
    - evidence_id: EV-E69D3AE69085
      kind: codegraph_context
      statement: /api/cart handler 的完整上下文未显示创建或传播请求级取消和 deadline。
      path: src/frontend/pages/api/cart.ts
      start_line: 13
      end_line: 54
      symbol: handler
      source_hash: 7d04d759ce10edad45aada6e5dc1926386825e39c2b280d4ac90adb055b7b410
    - evidence_id: EV-AA2DFBE05223
      kind: codegraph_node
      statement: 前端统一请求参数接口仅声明 URL、方法、请求体、查询参数与 Header，未声明 AbortSignal 或 timeout。
      path: src/frontend/utils/Request.ts
      start_line: 4
      end_line: 10
      symbol: IRequestParams
      source_hash: 075aef4680e7bcbf86689fbeecf24af3d7d64c0d0866ac4045dafd94e9e5d137
    - evidence_id: EV-73E99BFBD13D
      kind: codegraph_node
      statement: request 包装函数调用 fetch 时未显式传入 AbortSignal 或超时预算。
      path: src/frontend/utils/Request.ts
      start_line: 12
      end_line: 32
      symbol: request
      source_hash: 35293701727cf9957b5ec68962545818e44b89659d93a53ebcd81a9bedc19a86
  mechanism_chain:
    - order: 1
      cause: 用户流量进入 frontend 的 /api/cart handler。
      relation: awaits
      effect: handler 同步等待 cart 与 product-catalog 下游调用。
      evidence_ids: [EV-68FEEB5B95F8]
    - order: 2
      cause: 请求包装和 handler 未显式传播统一取消或 deadline。
      relation: may_allow
      effect: 下游网络延迟可能延长请求生命周期并占用处理容量。
      evidence_ids: [EV-E69D3AE69085, EV-AA2DFBE05223, EV-73E99BFBD13D]
    - order: 3
      cause: 延长的下游等待在持续 cart 流量下累积。
      relation: may_degrade
      effect: 入口成功率、延迟或吞吐可能违反固定 SLO。
      evidence_ids: [EV-68FEEB5B95F8, EV-73E99BFBD13D]
  supported_fault_types:
    - network-delay
    - network-loss
  injection_component: cart
  confidence: 0.35
  confidence_level: low
  residual_hypotheses:
    - frontend-proxy、Service Mesh 或运行时可能统一设置有效超时。
    - Cart gRPC gateway 方法或拦截器可能在具体调用时添加 deadline。
    - 混合工作负载中的 cart 请求密度可能不足以观察容量累积。
