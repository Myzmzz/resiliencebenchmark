defect_basis:
  template_id: RD-05
  defect_name: 推荐依赖熔断或回退机制失效候选
  evidence_description: >-
    recommendation 的 ListRecommendations 直接调用 get_product_list，后者在默认或缓存未命中路径调用
    product-catalog。当前代码上下文未显示明确的 circuit breaker、fallback 或异常映射，但前端能够隐藏空推荐，
    且统一 gRPC 保护尚未排除，因此需要用有界网络丢包区分候选机制。
  evidence:
    - evidence_id: EV-AA8AA65F071A
      kind: codegraph_node
      statement: RecommendationService.ListRecommendations 是推荐请求入口并调用商品列表辅助函数。
      path: src/recommendation/recommendation_server.py
      start_line: 43
      end_line: 56
      symbol: RecommendationService::ListRecommendations
      source_hash: 064f5dc1c48f4ad5dd55d73ab1adea4b3b8632ecc8e19c2ab0eed3c2649395a3
    - evidence_id: EV-61B067B36A84
      kind: codegraph_node
      statement: get_product_list 在默认或缓存未命中路径直接访问 product-catalog。
      path: src/recommendation/recommendation_server.py
      start_line: 67
      end_line: 113
      symbol: get_product_list
      source_hash: a4abd04f7e87adb8926678ac189a3ea3a3ae383c79c6f521e2065ef926e51c15
    - evidence_id: EV-AC81FBB8A65F
      kind: codegraph_edge
      statement: CodeGraph 记录 get_product_list 到 product-catalog ListProducts 的调用边。
      start_line: 78
      end_line: 78
      relation: calls
      source_hash: a3f1f2ee7b64b1b7d0a9c2efa61213921b7b8770e1e1ceb231f1acc1dfc1e0a1
    - evidence_id: EV-FD2487468E8D
      kind: codegraph_node
      statement: 前端 Recommendations 组件在推荐列表为空时能够不渲染该区域，构成部分降级反证。
      path: src/frontend/components/Recommendations/Recommendations.tsx
      start_line: 9
      end_line: 28
      symbol: Recommendations
      source_hash: e02d03342fea78a90a88df1a026ed7762bb7125f1bf7f430f1ab2a199db0913b
  mechanism_chain:
    - order: 1
      cause: 请求进入 RecommendationService.ListRecommendations。
      relation: calls
      effect: 入口同步调用 get_product_list 生成推荐商品列表。
      evidence_ids: [EV-AA8AA65F071A, EV-61B067B36A84]
    - order: 2
      cause: get_product_list 在默认或缓存未命中路径调用 product-catalog。
      relation: depends_on
      effect: product-catalog 网络丢包进入推荐请求关键路径。
      evidence_ids: [EV-61B067B36A84, EV-AC81FBB8A65F]
    - order: 3
      cause: 当前上下文未显示明确的熔断、回退或异常映射。
      relation: may_propagate
      effect: 推荐请求可能持续等待或失败，而不是快速受控降级。
      evidence_ids: [EV-61B067B36A84]
    - order: 4
      cause: 前端可隐藏空推荐但不能证明服务间调用已经受保护。
      relation: limits_scope
      effect: 故障影响应区分推荐服务退化与核心商品浏览失败。
      evidence_ids: [EV-FD2487468E8D]
  supported_fault_types: [network-loss, network-delay]
  injection_component: product-catalog
  confidence: 0.55
  confidence_level: medium
  residual_hypotheses:
    - gRPC wrapper、拦截器或 Envoy 可能已提供统一超时和快速失败。
    - 缓存命中可能吸收 product-catalog 故障。
    - product-catalog 同时服务核心商品列表，可能造成与推荐回退无关的直接影响。
