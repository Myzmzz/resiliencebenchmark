execution_policy:
  max_experiments: 5
  abort_conditions:
    - 当前 Pod UID 与运行时绑定不一致且无法重新确认。
    - 故障超出 otel-demo、product-catalog 或单目标范围。
    - 持续工作负载触发安全停止阈值。
    - 独立观测或清理能力不可用。
    - Agent 超时、失联或工具轨迹丢失。
