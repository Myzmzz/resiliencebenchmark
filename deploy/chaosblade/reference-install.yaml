# ChaosBlade：第二套环境的实测对象（2026-09-12 只读导出）
#
# 不是 Helm 管的,所以仓库里原本没有可照着装的东西。字段清理同可观测栈那份。
#
# 必须与同目录的 cgroupns-wrapper.yaml 一起用 —— DaemonSet 的 command/args 会把
# 原始 blade 挪成 blade.real 再用包装顶替它,没有那个 ConfigMap 这个 DaemonSet 起不来。
# 为什么需要包装见 README.md。
#
# 第三套环境要改:nodeSelector 的节点名,以及 operator 的镜像
# 1.94.151.57:85/ischaos/chaosblade-operator:1.8.0(旧集群 Harbor,需镜像化)。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaosblade-operator
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: chaosblade-operator
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-09-10T14:08:26-04:00'
      labels:
        name: chaosblade-operator
        part-of: chaosblade
    spec:
      containers:
      - args:
        - --chaosblade-image-repository=ghcr.io/chaosblade-io/chaosblade-tool
        - --chaosblade-version=1.8.0
        - --chaosblade-image-pull-policy=IfNotPresent
        - --log-level=info
        - --webhook-enable
        - --daemonset-enable
        - --remove-blade-interval=72h
        - --chaosblade-namespace=default
        command:
        - chaosblade-operator
        env:
        - name: WATCH_NAMESPACE
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: chaosblade-operator
        - name: DOCKER_API_VERSION
          value: '1.44'
        image: 1.94.151.57:85/ischaos/chaosblade-operator:1.8.0@sha256:131725633d0b8c3be7f148606beb4eb8354aec46c0ff758c633987778abd38ae
        imagePullPolicy: IfNotPresent
        name: chaosblade-operator
        ports:
        - containerPort: 9443
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        - mountPath: /opt
          name: chaosblade
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - cp
        - -R
        - /opt/chaosblade
        - /home
        image: ghcr.m.daocloud.io/chaosblade-io/chaosblade-tool:1.8.0@sha256:85a225a18d27fc2a2584f274185a20980122b8f239ce510058601e6bede80983
        imagePullPolicy: IfNotPresent
        name: chaosblade-tool
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home
          name: chaosblade
      nodeSelector:
        kubernetes.io/hostname: vm-0-10-ubuntu
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: chaosblade
      serviceAccountName: chaosblade
      terminationGracePeriodSeconds: 30
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: chaosblade-webhook-server-cert
      - emptyDir: {}
        name: chaosblade
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    deprecated.daemonset.template.generation: '3'
  labels:
    app: chaosblade-tool
    name: chaosblade-tool
  name: chaosblade-tool
  namespace: default
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: chaosblade-tool
      name: chaosblade-tool
  template:
    metadata:
      annotations:
        bladeai.environment/cgroupns-wrapper: v1
      labels:
        app: chaosblade-tool
        name: chaosblade-tool
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
      containers:
      - args:
        - 'set -eu

          cp /opt/chaosblade/blade /opt/chaosblade/blade.real

          cp /etc/chaosblade-wrapper/blade /opt/chaosblade/blade

          chmod 0755 /opt/chaosblade/blade /opt/chaosblade/blade.real

          exec tail -f /dev/null

          '
        command:
        - sh
        - -c
        env:
        - name: KUBERNETES_NODENAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: DOCKER_API_VERSION
          value: '1.44'
        - name: CGROUP_ROOT
          value: /host-sys/fs/cgroup/
        image: ghcr.m.daocloud.io/chaosblade-io/chaosblade-tool:1.8.0@sha256:85a225a18d27fc2a2584f274185a20980122b8f239ce510058601e6bede80983
        imagePullPolicy: IfNotPresent
        name: chaosblade-tool
        resources: {}
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/chaosblade-wrapper/blade
          name: cgroupns-wrapper
          readOnly: true
          subPath: blade
        - mountPath: /var/run/docker.sock
          name: docker-socket
        - mountPath: /opt/chaosblade/chaosblade.dat
          name: chaosblade-db-volume
        - mountPath: /etc/hosts
          name: hosts
        - mountPath: /var/log/audit
          name: audit
        - mountPath: /var/lib/docker
          name: docker-lib
        - mountPath: /etc/docker
          name: docker-etc
        - mountPath: /run/containerd
          name: containerd
        - mountPath: /var/lib/containerd
          name: containerd-lib
        - mountPath: /etc/containerd
          name: containerd-etc
        - mountPath: /var/run/netns
          name: netns
        - mountPath: /host-sys
          name: sys
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      hostPID: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: chaosblade
      serviceAccountName: chaosblade
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      - configMap:
          defaultMode: 493
          name: chaosblade-cgroupns-wrapper
        name: cgroupns-wrapper
      - hostPath:
          path: /var/run/docker.sock
          type: ''
        name: docker-socket
      - hostPath:
          path: /var/run/chaosblade.dat
          type: FileOrCreate
        name: chaosblade-db-volume
      - hostPath:
          path: /etc/hosts
          type: ''
        name: hosts
      - hostPath:
          path: /var/lib/docker
          type: ''
        name: docker-lib
      - hostPath:
          path: /etc/docker
          type: ''
        name: docker-etc
      - hostPath:
          path: /var/log/audit
          type: ''
        name: audit
      - hostPath:
          path: /run/containerd
          type: ''
        name: containerd
      - hostPath:
          path: /var/lib/containerd
          type: ''
        name: containerd-lib
      - hostPath:
          path: /etc/containerd
          type: ''
        name: containerd-etc
      - hostPath:
          path: /var/run/netns
          type: ''
        name: netns
      - hostPath:
          path: /sys
          type: ''
        name: sys
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
