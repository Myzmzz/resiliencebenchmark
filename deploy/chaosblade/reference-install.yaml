# ChaosBlade：第二套环境的实测对象（2026-09-12 只读导出）
#
# 不是 Helm 管的,所以仓库里原本没有可照着装的东西。字段清理同可观测栈那份。
#
# 顺序有讲究:CRD / ServiceAccount / ClusterRole / ClusterRoleBinding /
# webhook Service 必须先于 Deployment 与 DaemonSet——operator 起来就要用它们。
# 首次导出时漏了这五个先决对象,是做服务端 dry-run 时发现的。
#
# 必须与同目录的 cgroupns-wrapper.yaml 一起用 —— DaemonSet 的 command/args 会把
# 原始 blade 挪成 blade.real 再用包装顶替它,没有那个 ConfigMap 这个 DaemonSet 起不来。
# 为什么需要包装见 README.md。
#
# 第三套环境要改:nodeSelector 的节点名,以及 operator 的镜像
# 1.94.151.57:85/ischaos/chaosblade-operator:1.8.0(旧集群 Harbor,需镜像化)。
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chaosblades.chaosblade.io
spec:
  conversion:
    strategy: None
  group: chaosblade.io
  names:
    kind: ChaosBlade
    listKind: ChaosBladeList
    plural: chaosblades
    shortNames:
    - blade
    singular: chaosblade
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ChaosBlade is the Schema for the chaosblades API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: ChaosBladeSpec defines the desired state of ChaosBlade
            properties:
              experiments:
                description: 'INSERT ADDITIONAL SPEC FIELDS - desired state of cluster
                  Important: Run "operator-sdk generate k8s" to regenerate code after
                  modifying this file Add custom validation using kubebuilder tags:
                  https://book-v1.book.kubebuilder.io/beyond_basics/generating_crd.html'
                items:
                  properties:
                    action:
                      description: Action is the experiment scenario of the target,
                        such as delay, load
                      type: string
                    desc:
                      description: Desc is the experiment description
                      type: string
                    matchers:
                      description: Matchers is the experiment rules
                      items:
                        properties:
                          name:
                            description: Name is the name of flag
                            type: string
                          value:
                            description: 'TODO: Temporarily defined as an array for
                              all flags Value is the value of flag'
                            items:
                              type: string
                            type: array
                        required:
                        - name
                        - value
                        type: object
                      type: array
                    scope:
                      description: Scope is the area of the experiments, currently
                        support node, pod and container
                      type: string
                    target:
                      description: Target is the experiment target, such as cpu, network
                      type: string
                  required:
                  - action
                  - scope
                  - target
                  type: object
                type: array
            required:
            - experiments
            type: object
          status:
            description: ChaosBladeStatus defines the observed state of ChaosBlade
            properties:
              expStatuses:
                description: 'Important: Run "operator-sdk generate k8s" to regenerate
                  code after modifying this file Add custom validation using kubebuilder
                  tags: https://book-v1.book.kubebuilder.io/beyond_basics/generating_crd.html'
                items:
                  properties:
                    action:
                      type: string
                    error:
                      type: string
                    resStatuses:
                      description: ResStatuses is the details of the experiment
                      items:
                        properties:
                          error:
                            description: experiment error
                            type: string
                          id:
                            description: experiment uid in chaosblade
                            type: string
                          identifier:
                            description: 'Resource identifier, rules as following:
                              container: Namespace/NodeName/PodName/ContainerName
                              pod： Namespace/NodeName/PodName'
                            type: string
                          kind:
                            description: Kind
                            type: string
                          state:
                            description: experiment state
                            type: string
                          success:
                            description: success
                            type: boolean
                        required:
                        - kind
                        - state
                        - success
                        type: object
                      type: array
                    scope:
                      description: experiment scope for cache
                      type: string
                    state:
                      description: State is used to describe the experiment result
                      type: string
                    success:
                      description: Success is used to judge the experiment result
                      type: boolean
                    target:
                      type: string
                  required:
                  - action
                  - scope
                  - state
                  - success
                  - target
                  type: object
                type: array
              phase:
                description: Phase indicates the state of the experiment   Initial
                  -> Running -> Updating -> Destroying -> Destroyed
                type: string
            required:
            - expStatuses
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    name: chaosblade
  name: chaosblade
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    name: chaosblade
  name: chaosblade
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/exec
  - configmaps
  verbs:
  - '*'
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  verbs:
  - '*'
- apiGroups:
  - chaosblade.io
  resources:
  - chaosblades
  - chaosblades/status
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    name: chaosblade
  name: chaosblade
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaosblade
subjects:
- kind: ServiceAccount
  name: chaosblade
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: chaosblade-webhook-server
  namespace: default
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    name: chaosblade-operator
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaosblade-operator
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: chaosblade-operator
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-09-10T14:08:26-04:00'
      labels:
        name: chaosblade-operator
        part-of: chaosblade
    spec:
      containers:
      - args:
        - --chaosblade-image-repository=ghcr.io/chaosblade-io/chaosblade-tool
        - --chaosblade-version=1.8.0
        - --chaosblade-image-pull-policy=IfNotPresent
        - --log-level=info
        - --webhook-enable
        - --daemonset-enable
        - --remove-blade-interval=72h
        - --chaosblade-namespace=default
        command:
        - chaosblade-operator
        env:
        - name: WATCH_NAMESPACE
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: chaosblade-operator
        - name: DOCKER_API_VERSION
          value: '1.44'
        image: 1.94.151.57:85/ischaos/chaosblade-operator:1.8.0@sha256:131725633d0b8c3be7f148606beb4eb8354aec46c0ff758c633987778abd38ae
        imagePullPolicy: IfNotPresent
        name: chaosblade-operator
        ports:
        - containerPort: 9443
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        - mountPath: /opt
          name: chaosblade
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - cp
        - -R
        - /opt/chaosblade
        - /home
        image: ghcr.m.daocloud.io/chaosblade-io/chaosblade-tool:1.8.0@sha256:85a225a18d27fc2a2584f274185a20980122b8f239ce510058601e6bede80983
        imagePullPolicy: IfNotPresent
        name: chaosblade-tool
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home
          name: chaosblade
      nodeSelector:
        kubernetes.io/hostname: vm-0-10-ubuntu
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: chaosblade
      serviceAccountName: chaosblade
      terminationGracePeriodSeconds: 30
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: chaosblade-webhook-server-cert
      - emptyDir: {}
        name: chaosblade
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    deprecated.daemonset.template.generation: '3'
  labels:
    app: chaosblade-tool
    name: chaosblade-tool
  name: chaosblade-tool
  namespace: default
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: chaosblade-tool
      name: chaosblade-tool
  template:
    metadata:
      annotations:
        bladeai.environment/cgroupns-wrapper: v1
      labels:
        app: chaosblade-tool
        name: chaosblade-tool
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: type
                operator: NotIn
                values:
                - virtual-kubelet
      containers:
      - args:
        - 'set -eu

          cp /opt/chaosblade/blade /opt/chaosblade/blade.real

          cp /etc/chaosblade-wrapper/blade /opt/chaosblade/blade

          chmod 0755 /opt/chaosblade/blade /opt/chaosblade/blade.real

          exec tail -f /dev/null

          '
        command:
        - sh
        - -c
        env:
        - name: KUBERNETES_NODENAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: DOCKER_API_VERSION
          value: '1.44'
        - name: CGROUP_ROOT
          value: /host-sys/fs/cgroup/
        image: ghcr.m.daocloud.io/chaosblade-io/chaosblade-tool:1.8.0@sha256:85a225a18d27fc2a2584f274185a20980122b8f239ce510058601e6bede80983
        imagePullPolicy: IfNotPresent
        name: chaosblade-tool
        resources: {}
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/chaosblade-wrapper/blade
          name: cgroupns-wrapper
          readOnly: true
          subPath: blade
        - mountPath: /var/run/docker.sock
          name: docker-socket
        - mountPath: /opt/chaosblade/chaosblade.dat
          name: chaosblade-db-volume
        - mountPath: /etc/hosts
          name: hosts
        - mountPath: /var/log/audit
          name: audit
        - mountPath: /var/lib/docker
          name: docker-lib
        - mountPath: /etc/docker
          name: docker-etc
        - mountPath: /run/containerd
          name: containerd
        - mountPath: /var/lib/containerd
          name: containerd-lib
        - mountPath: /etc/containerd
          name: containerd-etc
        - mountPath: /var/run/netns
          name: netns
        - mountPath: /host-sys
          name: sys
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      hostPID: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: chaosblade
      serviceAccountName: chaosblade
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      - configMap:
          defaultMode: 493
          name: chaosblade-cgroupns-wrapper
        name: cgroupns-wrapper
      - hostPath:
          path: /var/run/docker.sock
          type: ''
        name: docker-socket
      - hostPath:
          path: /var/run/chaosblade.dat
          type: FileOrCreate
        name: chaosblade-db-volume
      - hostPath:
          path: /etc/hosts
          type: ''
        name: hosts
      - hostPath:
          path: /var/lib/docker
          type: ''
        name: docker-lib
      - hostPath:
          path: /etc/docker
          type: ''
        name: docker-etc
      - hostPath:
          path: /var/log/audit
          type: ''
        name: audit
      - hostPath:
          path: /run/containerd
          type: ''
        name: containerd
      - hostPath:
          path: /var/lib/containerd
          type: ''
        name: containerd-lib
      - hostPath:
          path: /etc/containerd
          type: ''
        name: containerd-etc
      - hostPath:
          path: /var/run/netns
          type: ''
        name: netns
      - hostPath:
          path: /sys
          type: ''
        name: sys
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
