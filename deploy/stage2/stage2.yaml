apiVersion: v1
kind: ServiceAccount
metadata:
  name: resbench-stage2-controller
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resbench-stage2-controller-cluster-control
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["chaosblade.io"]
    resources: ["chaosblades", "chaosblades/finalizers"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resbench-stage2-controller-cluster-control
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: resbench-stage2-controller-cluster-control
subjects:
  - kind: ServiceAccount
    name: resbench-stage2-controller
    namespace: resiliencebenchmark-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resbench-stage2-controller-runtime
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["resbench-stage2-executor", "resbench-stage2-finalizer"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resbench-stage2-controller-runtime
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resbench-stage2-controller-runtime
subjects:
  - kind: ServiceAccount
    name: resbench-stage2-controller
    namespace: resiliencebenchmark-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resbench-stage2-controller-otel-demo-control
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
rules:
  # Explicit application resources preserve Helm/reset work without granting
  # direct Chaos Mesh writes through the Controller's base identity.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "pods/eviction", "services", "services/proxy", "endpoints", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims", "events", "replicationcontrollers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets", "replicasets/scale", "statefulsets", "statefulsets/scale", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["networkchaos", "podchaos", "stresschaos"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resbench-stage2-controller-otel-demo-control
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resbench-stage2-controller-otel-demo-control
subjects:
  - kind: ServiceAccount
    name: resbench-stage2-controller
    namespace: resiliencebenchmark-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resbench-stage2-data
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
spec:
  storageClassName: standard
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resbench-stage2
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: resbench-stage2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resbench-stage2
        app.kubernetes.io/managed-by: resiliencebenchmark
    spec:
      serviceAccountName: resbench-stage2-controller
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        supplementalGroups: [10003, 10004]
      initContainers:
        - name: agent-workspace-permissions
          image: __STAGE2_AGENT_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              mkdir -p /work /sandbox /ipc &&
              chown 10001:10004 /work && chmod 2770 /work &&
              chown 10001:10003 /sandbox && chmod 2770 /sandbox &&
              chown 10001:10001 /ipc && chmod 2770 /ipc
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: trial-work
              mountPath: /work
            - name: sandbox-work
              mountPath: /sandbox
            - name: agent-exec-ipc
              mountPath: /ipc
      containers:
        # Ordinary sidecars work on the old Kubernetes 1.28 cluster.
        - name: litellm
          image: 1.94.151.57:85/observe/aiobs-litellm:v1
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          envFrom:
            - secretRef:
                name: litellm-upstream
          ports:
            - name: litellm
              containerPort: 4000
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: litellm
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: litellm
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
        - name: stage2
          image: __STAGE2_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STAGE2_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STAGE2_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: STAGE2_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STAGE2_D0_ARTIFACT_ROOT
              value: /var/lib/resbench-stage2/d0
            - name: RESBENCH_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: resbench-stage2-runtime
                  key: llm-base-url
            - name: RESBENCH_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resbench-stage2-runtime
                  key: llm-api-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/resbench-stage2
            - name: runtime
              mountPath: /etc/resbench-stage2
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: trial-work
              mountPath: /var/lib/resbench-stage2/agent-trials
            - name: agent-exec-ipc
              mountPath: /run/resbench
            - name: sandbox-work
              mountPath: /var/lib/resbench-stage2/sandbox-trials
            - name: controller-service-account
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
        - name: agent-runtime
          image: __STAGE2_AGENT_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/opt/agent/.venv/bin/python", "-m", "harness.agent_exec"]
          args:
            - --socket
            - /run/resbench/agent-exec.sock
            - --trial-root
            - /var/lib/resbench-stage2/agent-trials
            - --cgroup-root
            - /sys/fs/cgroup/resbench-agent-exec
            - --sandbox-trial-root
            - /var/lib/resbench-stage2/sandbox-trials
            - --controller-uid
            - "10001"
            - --agent-uid
            - "10002"
            - --agent-gid
            - "10004"
            - --shared-trial-gid
            - "10004"
            - --sandbox-uid
            - "10003"
            - --sandbox-gid
            - "10003"
            - --socket-gid
            - "10001"
            - --memory-max
            - "536870912"
            - --pids-max
            - "64"
            - --cpu-max
            - "100000 100000"
          env:
            - name: RESBENCH_AGENT_EXEC_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: RESBENCH_AGENT_EXEC_EGRESS_POLICY
              value: required
            - name: RESBENCH_AGENT_EXEC_AGENT_UID
              value: "10002"
            - name: RESBENCH_AGENT_EXEC_ALLOWED_LOOPBACK_PORTS
              value: "18081,18082,18083,18084,18085,18086,18087,18088,18181,18182,18183,18184,18185,18186,18187,18188,18090,18481"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "SYS_ADMIN", "SETUID", "SETGID", "SETPCAP", "KILL", "CHOWN", "FOWNER"]
          volumeMounts:
            - name: trial-work
              mountPath: /var/lib/resbench-stage2/agent-trials
            - name: agent-exec-ipc
              mountPath: /run/resbench
            - name: sandbox-work
              mountPath: /var/lib/resbench-stage2/sandbox-trials
            - name: agent-tmp
              mountPath: /tmp
            # This is the privileged daemon's TCB boundary.  It only accepts
            # `/sys/fs/cgroup/resbench-agent-exec/<pod-uid>` in code; evaluated
            # Agent children never receive this mount or CAP_SYS_ADMIN.
            - name: delegated-cgroup
              mountPath: /sys/fs/cgroup
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: resbench-stage2-data
        - name: runtime
          secret:
            secretName: resbench-stage2-runtime
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: trial-work
          emptyDir:
            sizeLimit: 2Gi
        - name: agent-exec-ipc
          emptyDir:
            sizeLimit: 64Mi
        - name: sandbox-work
          emptyDir:
            sizeLimit: 512Mi
        - name: agent-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: controller-service-account
          projected:
            # fsGroup=10001 makes this readable by the non-root controller,
            # while agent-runtime never mounts the volume.
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc.cluster.local
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                      fieldPath: metadata.namespace
        - name: delegated-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: resbench-stage2
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2
    app.kubernetes.io/managed-by: resiliencebenchmark
spec:
  selector:
    app.kubernetes.io/name: resbench-stage2
  ports:
    - name: http
      port: 8080
      targetPort: http
