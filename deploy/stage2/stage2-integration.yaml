apiVersion: apps/v1
kind: Deployment
metadata:
  name: resbench-stage2-integration
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2-integration
    app.kubernetes.io/managed-by: resiliencebenchmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: resbench-stage2-integration
  template:
    metadata:
      annotations:
        container.apparmor.security.beta.kubernetes.io/agent-runtime: localhost/resbench-agent-runtime
      labels:
        app.kubernetes.io/name: resbench-stage2-integration
        app.kubernetes.io/managed-by: resiliencebenchmark
        resiliencebenchmark.io/source-head: "__SOURCE_HEAD__"
    spec:
      serviceAccountName: resbench-stage2-controller
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        supplementalGroups: [10003, 10004]
      initContainers:
        - name: agent-workspace-permissions
          image: __STAGE2_AGENT_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              mkdir -p /work /sandbox /ipc /gateway-audit &&
              chown 10001:10004 /work && chmod 2770 /work &&
              chown 10001:10003 /sandbox && chmod 2770 /sandbox &&
              chown 10001:10001 /gateway-audit && chmod 0700 /gateway-audit &&
              chown 10001:10001 /ipc && chmod 2770 /ipc
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: trial-work
              mountPath: /work
            - name: sandbox-work
              mountPath: /sandbox
            - name: agent-exec-ipc
              mountPath: /ipc
            - name: gateway-audit
              mountPath: /gateway-audit
      containers:
        # Ordinary sidecars work on the old Kubernetes 1.28 cluster.
        - name: litellm
          image: 1.94.151.57:85/observe/resbench-litellm:1.92.0@sha256:237ed94c2b4bd821d44f4abd4b57b2ae7b3108a7b4a768d1d8cd7c1b3884c604
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/litellm"]
          args:
            - --config
            - /etc/litellm/config.yaml
            - --host
            - 127.0.0.1
            - --port
            - "4000"
          env:
            - {name: STAGE2_LITELLM_CONFIG_FILE, value: /etc/litellm/config.yaml}
            - {name: RESBENCH_GATEWAY_AUDIT_DIR, value: /var/lib/resbench-stage2/gateway-audit}
          envFrom:
            - secretRef:
                name: litellm-upstream
          ports:
            - name: litellm
              containerPort: 4000
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: litellm-config
              mountPath: /etc/litellm/gateway_audit.py
              subPath: gateway_audit.py
              readOnly: true
            - name: gateway-audit
              mountPath: /var/lib/resbench-stage2/gateway-audit
          startupProbe:
            exec:
              command: ["/app/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2).close()"]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["/app/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:4000/health/readiness', timeout=2).close()"]
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
        - name: stage2
          image: __STAGE2_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STAGE2_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STAGE2_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: STAGE2_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STAGE2_PRIVATE_ROOT
              value: /var/lib/resbench-stage2/integration/private
            - name: STAGE2_ARTIFACT_ROOT
              value: /var/lib/resbench-stage2/integration/artifacts
            - name: STAGE2_D0_ARTIFACT_ROOT
              value: /var/lib/resbench-stage2/integration/d0
            - name: STAGE2_KUBECONFIG
              value: /var/lib/resbench-stage2/integration/private/service.kubeconfig
            - name: STAGE2_LITELLM_CONFIG_FILE
              value: /etc/litellm/config.yaml
            - name: RESBENCH_GATEWAY_AUDIT_DIR
              value: /var/lib/resbench-stage2/gateway-audit
            # Coroot backup observation source (2026-09-10): this cluster's
            # Coroot project, which serves reads without login.
            - name: RESBENCH_COROOT_PROJECT_ID
              value: 9auios5b
            - name: RESBENCH_COROOT_ALLOW_ANONYMOUS_READ
              value: "true"
            - name: RESBENCH_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: resbench-stage2-gateway-client
                  key: llm-base-url
            - name: RESBENCH_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resbench-stage2-gateway-client
                  key: llm-api-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/resbench-stage2
            - name: runtime
              mountPath: /etc/resbench-stage2
              readOnly: true
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: gateway-audit
              mountPath: /var/lib/resbench-stage2/gateway-audit
            - name: tmp
              mountPath: /tmp
            - name: trial-work
              mountPath: /var/lib/resbench-stage2/agent-trials
            - name: agent-exec-ipc
              mountPath: /run/resbench
            - name: sandbox-work
              mountPath: /var/lib/resbench-stage2/sandbox-trials
            - name: controller-service-account
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
        - name: agent-runtime
          image: __STAGE2_AGENT_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/opt/agent/.venv/bin/python", "-m", "harness.agent_exec"]
          args: ["--socket", "/run/resbench/agent-exec.sock", "--trial-root", "/var/lib/resbench-stage2/agent-trials", "--sandbox-trial-root", "/var/lib/resbench-stage2/sandbox-trials", "--cgroup-root", "/run/resbench-cgroups", "--controller-uid", "10001", "--agent-uid", "10002", "--agent-gid", "10004", "--shared-trial-gid", "10004", "--sandbox-uid", "10003", "--sandbox-gid", "10003", "--socket-gid", "10001", "--memory-max", "536870912", "--pids-max", "64", "--cpu-max", "100000 100000"]
          env:
            - name: RESBENCH_AGENT_EXEC_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: RESBENCH_AGENT_EXEC_EGRESS_POLICY
              value: required
            - name: RESBENCH_AGENT_EXEC_AGENT_UID
              value: "10002"
            - name: RESBENCH_AGENT_EXEC_ALLOWED_LOOPBACK_PORTS
              value: "18081,18082,18083,18084,18085,18086,18087,18088,18181,18182,18183,18184,18185,18186,18187,18188,18090,18481"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "SYS_ADMIN", "SETUID", "SETGID", "SETPCAP", "KILL", "CHOWN", "FOWNER"]
          volumeMounts:
            - name: trial-work
              mountPath: /var/lib/resbench-stage2/agent-trials
            - name: agent-exec-ipc
              mountPath: /run/resbench
            - name: sandbox-work
              mountPath: /var/lib/resbench-stage2/sandbox-trials
            - name: agent-tmp
              mountPath: /tmp
            - name: delegated-cgroup
              mountPath: /run/resbench-cgroups
            - name: host-cgroup-namespace
              mountPath: /run/resbench-host/cgroupns
              readOnly: true
          readinessProbe:
            exec:
              command: ["/opt/agent/.venv/bin/python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/resbench/agent-exec.sock'); s.close()"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: gateway-audit
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: resbench-stage2-data
        - name: runtime
          secret:
            secretName: resbench-stage2-runtime
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: trial-work
          emptyDir:
            sizeLimit: 2Gi
        - name: agent-exec-ipc
          emptyDir:
            sizeLimit: 64Mi
        - name: sandbox-work
          emptyDir:
            sizeLimit: 512Mi
        - name: agent-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: controller-service-account
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc.cluster.local
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: delegated-cgroup
          hostPath:
            path: /sys/fs/cgroup/resbench-agent-exec
            type: DirectoryOrCreate
        - name: host-cgroup-namespace
          hostPath:
            path: /proc/1/ns/cgroup
            type: File
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: resbench-stage2-integration
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2-integration
spec:
  selector:
    app.kubernetes.io/name: resbench-stage2-integration
  ports:
    - name: http
      port: 8080
      targetPort: http
