apiVersion: apps/v1
kind: Deployment
metadata:
  name: resbench-stage2-integration
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2-integration
    app.kubernetes.io/managed-by: resiliencebenchmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: resbench-stage2-integration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resbench-stage2-integration
        app.kubernetes.io/managed-by: resiliencebenchmark
        resiliencebenchmark.io/source-head: "__SOURCE_HEAD__"
    spec:
      serviceAccountName: resbench-stage2
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: stage2
          image: __STAGE2_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STAGE2_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STAGE2_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: STAGE2_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STAGE2_PRIVATE_ROOT
              value: /var/lib/resbench-stage2/integration/private
            - name: STAGE2_ARTIFACT_ROOT
              value: /var/lib/resbench-stage2/integration/artifacts
            - name: STAGE2_D0_ARTIFACT_ROOT
              value: /var/lib/resbench-stage2/integration/d0
            - name: STAGE2_KUBECONFIG
              value: /var/lib/resbench-stage2/integration/private/service.kubeconfig
            - name: RESBENCH_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: resbench-stage2-runtime-e2e
                  key: llm-base-url
            - name: RESBENCH_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resbench-stage2-runtime-e2e
                  key: llm-api-key
          volumeMounts:
            - name: data
              mountPath: /var/lib/resbench-stage2
            - name: runtime
              mountPath: /etc/resbench-stage2
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: resbench-stage2-data
        - name: runtime
          secret:
            secretName: resbench-stage2-runtime
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: resbench-stage2-integration
  namespace: resiliencebenchmark-system
  labels:
    app.kubernetes.io/name: resbench-stage2-integration
spec:
  selector:
    app.kubernetes.io/name: resbench-stage2-integration
  ports:
    - name: http
      port: 8080
      targetPort: http
