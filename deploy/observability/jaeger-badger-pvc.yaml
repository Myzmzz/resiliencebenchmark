apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-badger-data
  namespace: observability
  labels:
    app: jaeger
    resiliencebenchmark.io/managed-by: resiliencebenchmark
    resiliencebenchmark.io/purpose: bounded-trace-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
