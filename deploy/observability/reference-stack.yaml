# 可观测栈：第二套环境的实测对象（2026-09-12 只读导出）
#
# 仓库里 environment/observability/ 那几个文件是往一套已有安装上打的补丁，
# 不是从零安装的清单;这套栈也不是 Helm 管的。所以在第三套环境上没有东西可照着装。
# 本文件把第二套环境里真正在跑的对象原样导出,去掉 status、resourceVersion、uid、
# managedFields、last-applied-configuration、Service 的 clusterIP 等集群特有字段。
#
# 这不是"直接 apply 就完事"的清单。第三套环境至少要改三处(全部列在
# docs/status/stage2-env3-reference-state-20260912.md):
#
#   1. nodeSelector 里的 kubernetes.io/hostname: vm-0-10-ubuntu —— 换成本环境的节点
#   2. 镜像 1.94.151.57:85/train-ticket/* —— 那是旧集群的 HTTP 明文 Harbor,
#      第三套环境大概率路由不到,必须先镜像化到公开仓库
#   3. PVC prometheus-tsdb 的 storageClassName: nfs-client —— 换成本环境的存储类
#
# promtail-config 里写死了三个被测系统的日志路径(train-ticket / sock-shop /
# otel-demo);只跑 otel-demo 的话可以只留一条。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jaeger
  name: jaeger
  namespace: observability
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: jaeger
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - tcse-v100-01
      containers:
      - command:
        - /go/bin/all-in-one-linux
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: 'true'
        - name: SPAN_STORAGE_TYPE
          value: memory
        image: 1.94.151.57:85/train-ticket/jaeger-all-in-one:1.57@sha256:d8b87c36133ce920cda4f5ec15363362f84eac9f78cb1c232191914a103750d4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: query
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: jaeger
        ports:
        - containerPort: 16686
          name: query
          protocol: TCP
        - containerPort: 4317
          name: otlp-grpc
          protocol: TCP
        - containerPort: 4318
          name: otlp-http
          protocol: TCP
        - containerPort: 14268
          name: thrift-http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: query
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: vm-0-10-ubuntu
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
