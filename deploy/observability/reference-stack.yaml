    \n  - job_name: kubernetes-cadvisor\n    scheme: https\n    tls_config:\n    \
    \  insecure_skip_verify: true\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \    kubernetes_sd_configs:\n      - role: node\n    relabel_configs:\n      -\
    \ action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n      -\
    \ target_label: __address__\n        replacement: kubernetes.default.svc:443\n\
    \      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n \
    \       target_label: __metrics_path__\n        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor\n\
    \n  - job_name: kube-state-metrics\n    static_configs:\n      - targets:\n  \
    \        - kube-state-metrics.observability.svc:8080\n\n  - job_name: node-exporter\n\
    \    kubernetes_sd_configs:\n      - role: endpoints\n        namespaces:\n  \
    \        names:\n            - observability\n    relabel_configs:\n      - source_labels:\
    \ [__meta_kubernetes_service_name]\n        action: keep\n        regex: node-exporter\n\
    \      - source_labels: [__meta_kubernetes_endpoint_port_name]\n        action:\
    \ keep\n        regex: metrics\n\n  - job_name: otel-collector\n    static_configs:\n\
    \      - targets:\n          - otel-collector.observability.svc:8889\n\n  - job_name:\
    \ kubernetes-pods-annotated\n    kubernetes_sd_configs:\n      - role: pod\n \
    \   relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n\
    \        action: keep\n        regex: true\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]\n\
    \        action: replace\n        regex: (https?)\n        target_label: __scheme__\n\
    \      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n\
    \        action: replace\n        target_label: __metrics_path__\n        regex:\
    \ (.+)\n      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]\n\
    \        action: replace\n        regex: ([^:]+)(?::\\d+)?;(\\d+)\n        replacement:\
    \ $1:$2\n        target_label: __address__\n      - action: labelmap\n       \
    \ regex: __meta_kubernetes_pod_label_(.+)\n      - source_labels: [__meta_kubernetes_namespace]\n\
    \        action: replace\n        target_label: namespace\n      - source_labels:\
    \ [__meta_kubernetes_pod_name]\n        action: replace\n        target_label:\
    \ pod\n\n# Promote OTLP resource attributes to series labels (2026-09-10, same\
    \ as\n# the old cluster). Without them request series cannot be tied to a Pod.\n\
    otlp:\n  promote_resource_attributes:\n    - service.name\n    - k8s.namespace.name\n\
    \    - k8s.pod.name\n    - k8s.pod.uid\n"
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
---
apiVersion: v1
data:
  config.yaml: "server:\n  http_listen_port: 3101\n  grpc_listen_port: 0\n\npositions:\n\
    \  filename: /run/promtail/positions.yaml\n\nclients:\n  - url: http://loki.observability.svc:3100/loki/api/v1/push\n\
    \nscrape_configs:\n  - job_name: dut-pods\n    pipeline_stages:\n      - docker:\
    \ {}\n      - drop:\n          older_than: 168h\n          drop_counter_reason:\
    \ outside_loki_retention_window\n      - regex:\n          source: filename\n\
    \          expression: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_(?P<pod_uid>[^/]+)/(?P<container>[^/]+)/[0-9]+\\\
    .log$'\n      - labels:\n          namespace:\n          pod:\n          container:\n\
    \    static_configs:\n      - targets: [localhost]\n        labels:\n        \
    \  job: dut-pods\n          __path__: /var/log/pods/train-ticket_*/*/*.log\n \
    \     - targets: [localhost]\n        labels:\n          job: dut-pods\n     \
    \     __path__: /var/log/pods/sock-shop_*/*/*.log\n      - targets: [localhost]\n\
    \        labels:\n          job: dut-pods\n          __path__: /var/log/pods/otel-demo_*/*/*.log\n"
kind: ConfigMap
