[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resiliencebenchmark"
version = "0.1.0"
description = "Environment preparation contracts and safety tooling for a microservice resilience BenchmarkFactory"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20,<5",
  "mcp[cli]>=2,<3",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["controller*", "disturbances*", "evaluator*", "mcp_servers*", "progression*", "scoring*", "scripts*"]
exclude = ["artifacts*", "environment*", "harness*", "runs*", "tasks*", "tests*", "tmp*"]

[tool.setuptools.package-data]
disturbances = ["library.yaml", "schemas/*.json", "README.md"]
evaluator = ["schemas/*.json"]
scoring = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "controller/tests", "evaluator"]
addopts = "-q"
