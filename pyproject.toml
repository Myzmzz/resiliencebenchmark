[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resiliencebenchmark"
version = "0.1.0"
description = "Environment preparation contracts and safety tooling for a microservice resilience BenchmarkFactory"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.20,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests", "controller/tests", "evaluator"]
addopts = "-q"
