version: resiliencebenchmark.harness.adapters/v1
description: >
  Uniform adapter registry for Agent harnesses. Runtime launchers should merge
  this file with environment-specific secrets supplied outside the repository.

shared:
  run_isolation:
    workspace: ephemeral_per_trial
    artifact_root: artifacts/harness
    retain_raw_transcript: true
    redact_secret_patterns: true
  allowed_mcp_tools_ref: mcp-tools.yaml
  mcp_client_templates:
    bladeai: bladeai/mcp.json.template
    codex: codex/config.toml.template
    claude_code: claude-code/mcp.json.template
    deepseek_harness: deepseek-harness/mcp.cordis.patch.yml
  model_registry_ref: models.yaml
  prompt_templates:
    common_task: prompts/common-task.md
    connectivity_smoke: prompts/connectivity-smoke.md
    chaos_write_smoke: prompts/chaos-write-smoke.md
    full_lifecycle: prompts/full-lifecycle.md
    minimal_intent: prompts/minimal-intent.md
  hidden_from_agent:
    - ground_truth
    - evaluator_oracle
    - oracle_raw_verdicts
    - injected_defect_manifest
    - scoring_rubric_weights

harnesses:
  bladeai:
    kind: bladeai
    status: live_read_only_sse_qualified
    qualification_status: passed_with_nonfatal_shutdown_warning
    entrypoint:
      mode: cli_or_service
      command: blade-ai
      prompt_transport: adapter_owned
      args: []
    mcp:
      template: bladeai/mcp.json.template
      qualification: bladeai/qualification.yaml
      env_example: bladeai/env.example
      enabled_flag: env:BLADE_AI_MCP_ENABLED
      config_path_flag: env:BLADE_AI_MCP_CONFIG_PATH
      config_path_status: declared_but_bladeai_v0_6_2_loader_uses_home_default
      transport_status: native_sse_runtime_live_qualified_read_only
      host_native_sse_listeners:
        k8s_ro: 127.0.0.1:18181
        telemetry_ro: 127.0.0.1:18182
        source_ro: 127.0.0.1:18183
      read_only_servers:
        - k8s_ro
        - telemetry_ro
        - source_ro
      attach_to:
        k8s_ro:
          - verifier
        telemetry_ro:
          - verifier
        source_ro:
          - verifier
      chaos_control: disabled_in_bladeai_external_controller_only
    models:
      source: models.yaml
      candidate_aliases_requiring_probe:
        - gpt-5.6
        - gpt-5.6-sol
        - deepseek-v4-pro
        - qwen3.8-max
        - claude-opus-5
        - MiniMax-M3
        - glm-5.3
        - kimi-k2.5
    safety:
      require_controller_budget_token: true
      deny_direct_oracle_access: true
      deny_unscoped_shell: true
    session:
      logical_resume: false
      reason: current Stage2 adapter uses the direct one-shot worker

  claude-code:
    kind: claude_code
    status: live_connectivity_smoke_qualified_full_lifecycle_pending
    entrypoint:
      mode: headless_cli
      command: claude
      prompt_transport: stdin
      args:
        - --print
        - --verbose
        - --bare
        - --output-format
        - stream-json
        - --model
        - "{{model_alias}}"
        - --mcp-config
        - "{{mcp_config_file}}"
        - --strict-mcp-config
        - --tools
        - ""
        - --allowedTools
        - mcp__k8s_ro,mcp__telemetry_ro,mcp__source_ro,mcp__chaos_control
    environment:
      anthropic_base_url: env:RESBENCH_LLM_BASE_URL
      anthropic_api_key: env:RESBENCH_LLM_API_KEY
      anthropic_auth_token: env:RESBENCH_LLM_API_KEY
      claude_config_home: env:RESBENCH_CLAUDE_HOME
    models:
      source: models.yaml
      default_alias: claude-opus-5
      matrix_aliases:
        - gpt-5.6-sol
        - claude-opus-5
    safety:
      require_fresh_config_home_per_trial: true
      deny_direct_oracle_access: true
      deny_unscoped_shell: true
    session:
      logical_resume: true
      resume_flag: --resume

  codex:
    kind: codex
    status: live_connectivity_smoke_qualified_full_lifecycle-timeout
    entrypoint:
      mode: headless_cli
      command: codex
      prompt_transport: stdin
      args:
        - exec
        - --model
        - "{{model_alias}}"
        - --sandbox
        - read-only
        - --skip-git-repo-check
        - --json
        - --output-schema
        - "{{output_schema_file}}"
        - "-"
    environment:
      openai_base_url: env:RESBENCH_LLM_BASE_URL
      openai_api_key: env:RESBENCH_LLM_API_KEY
      codex_home: env:RESBENCH_CODEX_HOME
    models:
      source: models.yaml
      candidate_aliases_requiring_probe:
        - gpt-5.6
        - gpt-5.6-sol
        - deepseek-v4-pro
        - qwen3.8-max
        - claude-opus-5
        - MiniMax-M3
        - glm-5.3
        - kimi-k2.5
    safety:
      require_fresh_codex_home_per_trial: true
      deny_direct_oracle_access: true
      deny_unscoped_shell: true
    session:
      logical_resume: true
      resume_command: codex exec resume

  deepseek-harness:
    kind: official_deepseek_harness
    status: live_connectivity_smoke_qualified_tool_trace_pending
    entrypoint:
      mode: headless_cli
      command: dsh
      prompt_transport: single_positional_argument
      args:
        - --profile
        - headless
        - "{{prompt_text}}"
    environment:
      base_url: env:RESBENCH_LLM_BASE_URL
      api_key: env:RESBENCH_LLM_API_KEY
      dsh_home: env:DSH_HOME
    isolation:
      headless: true
      dsh_home_strategy: mktemp_per_trial
      require_empty_dsh_home: true
      cleanup_dsh_home_after_trial: true
      forbid_shared_web_host_for_trials: true
    trace:
      current_capture: redacted-headless-stdout-and-final-result
      session_tool_export: live-smoke-confirmed-absent-from-run-trace
      scored_trial_eligibility: blocked-until-complete-tool-trace-pass
    session:
      logical_resume: false
      reason: shipped headless profile is one-shot
    models:
      source: models.yaml
      default_alias: gpt-5.6-sol
      matrix_aliases:
        - gpt-5.6-sol
        - claude-opus-5
    safety:
      require_controller_budget_token: true
      deny_direct_oracle_access: true
      deny_unscoped_shell: true
