apiVersion: resiliencebenchmark.io/v1alpha1
kind: HarnessDeploymentStatus
metadata:
  name: deepseek-harness
spec:
  targetHostRef: env:RESBENCH_HARNESS_HOST
  bootstrapIdentityRef: env:RESBENCH_SSH_BOOTSTRAP_IDENTITY
  bootstrapKnownHostsRef: env:RESBENCH_SSH_KNOWN_HOSTS
  requestedPublicKeyFingerprint: SHA256:v2dwQu07KnY7LxfIq+4adT7ZV+MLrl8vkIPyBal6WRQ
  installScript: harness/deepseek-harness/install.sh
  installRoot: /opt/resiliencebenchmark/deepseek-harness
  runUser: resbench
  trialMode: headless
  sharedWebHostAllowed: false
  currentStatus: awaiting-public-key-authorization
  acceptance:
    - ssh-batch-mode-key-authentication-pass
    - strict-host-key-verification-pass
    - node-version-compatible
    - npm-integrity-check-pass
    - exact-dsh-version-installed
    - transitive-dependency-tree-recorded-before-matrix-freeze
    - fresh-dsh-home-per-trial
    - no-provider-secret-persisted
    - headless-read-only-mcp-smoke-pass
    - complete-redacted-tool-trace-export-pass-before-scored-use
