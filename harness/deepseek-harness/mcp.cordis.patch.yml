- insert:
    - id: mcp-k8s-ro
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: k8s_ro
        transport: streamable-http
        url: !!js process.env.RESBENCH_K8S_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
    - id: mcp-telemetry-ro
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: telemetry_ro
        transport: streamable-http
        url: !!js process.env.RESBENCH_TELEMETRY_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
    - id: mcp-source-ro
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: source_ro
        transport: streamable-http
        url: !!js process.env.RESBENCH_SOURCE_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
    - id: mcp-chaos-control
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chaos_control
        transport: streamable-http
        url: !!js process.env.RESBENCH_CHAOS_CONTROL_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
