# Headless benchmark trials expose only the explicit MCP surface. The base
# bundle's shell, filesystem mutation, web, subagent, workflow, and editor tools
# remain unavailable to the tested Agent.
- id: code-runtime
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true

- insert:
    - id: mcp-k8s-ro
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: k8s_ro
        transport: streamable-http
        url: !!js process.env.RESBENCH_K8S_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
        failOnStartupError: true
    - id: mcp-telemetry-ro
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: telemetry_ro
        transport: streamable-http
        url: !!js process.env.RESBENCH_TELEMETRY_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
        failOnStartupError: true
    - id: mcp-source-ro
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: source_ro
        transport: streamable-http
        url: !!js process.env.RESBENCH_SOURCE_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
        failOnStartupError: true
    - id: mcp-chaos-control
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chaos_control
        transport: streamable-http
        url: !!js process.env.RESBENCH_CHAOS_CONTROL_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
        failOnStartupError: true
