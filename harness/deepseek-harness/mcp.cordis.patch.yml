- insert:
    - id: mcp-k8s-ro
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: k8s_ro
        transport: streamable-http
        url: !!js process.env.RESBENCH_K8S_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.RESBENCH_MCP_TOKEN}`'
    - id: mcp-prometheus-ro
      name: '@deepseek-ai/dsh-mcp-client'
      config:
