version: resiliencebenchmark.harness.mcp-tools/v1
description: >
  MCP capability surface exposed to benchmark agents. This file defines logical
  tools and permissions only; endpoint wiring is supplied by the runtime.

runtime_refs:
  k8s: service_ref:k8s_ro
  telemetry: service_ref:telemetry_ro
  source: service_ref:source_ro
  chaos: service_ref:chaos_control

tools:
  harness_channel:
    mode: controlled_write
    purpose: Confirm Agent plans, consult the Harness, submit results, and receive Controller notices.
    allowed_operations:
      - harness_confirm
      - harness_consult
      - harness_submit_result
      - harness_poll_notices
    denied_operations:
      - change_trial_identity
      - change_permissions
      - read_oracle
    scope:
      identity_from_controller: true
      always_available_for_trial: true
  k8s_ro:
    mode: read_only
    purpose: Inspect Kubernetes objects, events, pod status, service topology, and logs metadata.
    allowed_operations:
      - k8s_get_resource
      - k8s_list_resources
      - k8s_list_events
      - k8s_pod_logs
      - k8s_cluster_inventory
    denied_operations:
      - create
      - update
      - patch
      - delete
      - exec
      - port_forward
      - watch
      - describe_shell
      - read_secrets
      - read_configmap_data
    scope:
      namespaces_from_episode: true
      cluster_scoped_reads: limited_inventory_only
      kubeconfig_from_server_runtime_only: true

  telemetry_ro:
    mode: read_only
    purpose: Query scoped Prometheus metrics, Jaeger traces, and Loki logs for baseline, fault effect, diagnosis, and recovery evidence.
    allowed_operations:
      - telemetry_prom_metric_instant
      - telemetry_prom_metric_range
      - telemetry_prom_metric_series
      - telemetry_prom_list_labels
      - telemetry_jaeger_list_services
      - telemetry_jaeger_list_operations
      - telemetry_jaeger_find_traces
      - telemetry_loki_list_labels
      - telemetry_loki_logs
      - telemetry_loki_logs_range
    denied_operations:
      - upstream_url_override
      - unbounded_time_window
      - cross_namespace_result
      - arbitrary_promql
      - arbitrary_logql
      - arbitrary_trace_id_lookup
      - telemetry_admin
      - write
      - delete
    scope:
      query_time_window_from_controller: true
      one_namespace_per_episode: true
      service_allowlist_from_episode: true
      upstream_label_scope_required_for_shared_cluster: true

  source_ro:
    mode: read_only
    purpose: Read service source code snapshots mapped by service name, image digest, and commit.
    allowed_operations:
      - source_list_repositories
      - source_list_files
      - source_read_file
      - source_search_text
      - source_show_commit
    denied_operations:
      - write_file
      - git_commit
      - git_push
      - reveal_hidden_ground_truth
    scope:
      source_root_from_server_runtime_only: true
      application_allowlist_from_episode: true

  chaos_control:
    mode: controlled_write
    purpose: Request controller-approved ChaosBlade experiments and recovery actions.
    allowed_operations:
      - chaos_validate_plan
      - chaos_inventory_run
      - chaos_create_experiment
      - chaos_get_experiment
      - chaos_operation_status
      - chaos_destroy_experiment
      - chaos_recovery_status
    denied_operations:
      - arbitrary_shell
      - unbounded_namespace
      - host_wide_without_episode_approval
      - bypass_controller_budget
    gates:
      require_episode_fault_allowlist: true
      require_controller_budget_token: true
      require_preflight_baseline_passed: true
      require_cleanup_handle: true
      require_live_target_pod_uid: true
      require_global_chaosblade_inventory_clear: true
      baseline_capability_one_time_use: true
      require_durable_deadline_watchdog: true

  coroot_ro:
    mode: read_only
    purpose: Optional D7 scoped Coroot evidence source; registered only for substitution trials.
    allowed_operations: [coroot_metrics_range, coroot_traces_find, coroot_logs_range]
    denied_operations: [write, delete, upstream_url_override]
  chaos_mesh_control:
    mode: controlled_write
    purpose: Optional D8 Controller-gated Chaos Mesh executor; registered only for substitution trials.
    allowed_operations: [chaos_mesh_validate_plan, chaos_mesh_inventory_run, chaos_mesh_create_experiment, chaos_mesh_get_experiment, chaos_mesh_operation_status, chaos_mesh_destroy_experiment, chaos_mesh_recovery_status]
    denied_operations: [arbitrary_shell, bypass_controller_budget]
  code_sandbox:
    mode: controlled_write
    purpose: Optional bounded code execution through the Agent execution sidecar.
    allowed_operations: [run_python]
    denied_operations: [network, direct_mcp_credentials, host_shell]

not_exposed_to_agent:
  oracle:
    reason: Independent Oracle is evaluator-only and must not influence Agent behavior.
    includes:
      - hidden_ground_truth
      - defect_manifest
      - expected_root_cause
      - scorer_verdict
      - recovery_oracle_raw_signals
