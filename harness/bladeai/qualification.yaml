version: resiliencebenchmark.harness.bladeai.qualification/v1
bladeai:
  version: 0.6.2
  code_remediation:
    status: implemented_pending_validation
    tests: paused_by_user
    deployment: not_performed
    evidence_requirements: unchanged_full_wp8_chain
    report: docs/status/bladeai-code-remediation-20260906.md
  capability_source: local_source_and_tests
  source_contract:
    mcp_role: client
    config_file: mcp.json
    config_root: mcpServers
    supported_transports:
      - stdio
      - http_sse
    unsupported_transports:
      - streamable_http_client
    enabled_flag: BLADE_AI_MCP_ENABLED
    config_path_flag: BLADE_AI_MCP_CONFIG_PATH
    config_path_status: declared_but_loader_uses_default_home_path
    default_path: ~/.blade-ai/mcp.json
    runtime_transport_status: historical_read_only_smoke_only
    host_native_sse_listeners:
      k8s_ro: 127.0.0.1:18181
      telemetry_ro: 127.0.0.1:18182
      source_ro: 127.0.0.1:18183
    allowed_attach_to:
      - clarification
      - phase1
      - phase2
      - verifier
  benchmark_template:
    file: mcp.json.template
    read_only_servers:
      - k8s_ro
      - telemetry_ro
      - source_ro
      - coroot_ro
      - harness_channel
    attach_to:
      k8s_ro:
        - clarification
        - phase1
        - phase2
        - verifier
      telemetry_ro:
        - clarification
        - phase1
        - phase2
        - verifier
      source_ro:
        - clarification
        - phase1
        - phase2
        - verifier
      coroot_ro:
        - clarification
        - phase1
        - phase2
        - verifier
    controlled_write_servers:
      chaos_control:
        enabled: false
        reason: >
          BladeAI v0.6.2 cannot classify dynamic MCP tool scope for the target
          guard. ChaosBlade write actions must be executed by the benchmark
          controller after budget, UID, baseline, and cleanup gates pass.
      chaos_mesh_control:
        enabled: false
        reason: BladeAI writes are only available through the controlled blade shim.
  gates:
    before_qualifying_bladeai:
      - render template with runtime-only token
      - copy or symlink rendered file to ~/.blade-ai/mcp.json
      - set BLADE_AI_MCP_ENABLED=true
      - render URLs to authenticated loopback SSE listeners including harness_channel and coroot_ro
      - verify startup logs contain MCP connected for every read-only service
      - verify chaos_control is not connected from BladeAI
      - verify BLADE_AI_BLADE_PATH resolves exactly to harness/bladeai/blade-shim/blade
      - verify the SDK kubeconfig points to the loopback proxy and exposes no ServiceAccount credential
      - exercise read, confirmation, shim create/destroy, notice, consult, and result submission in one Trial
  live_evidence:
    status: platform_integration_incomplete
    bladeAiVersion: 0.6.2
    serverReady: true
    connectedTools:
      k8s_ro: 5
      telemetry_ro: 10
      source_ro: 5
    chaosControlConnected: false
    attachTo: historical-verifier-only
    historicalEvidence: Timed read-only smoke predated task-mode, Harness channel, proxy, and blade shim.
    missingRequiredInteractions:
      - task_mode_l4_target_none
      - loopback_kubernetes_proxy
      - harness_confirm_affects_execution
      - controlled_shim_create_destroy
      - in_band_notice
      - harness_consult
      - harness_submit_result
