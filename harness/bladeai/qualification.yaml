version: resiliencebenchmark.harness.bladeai.qualification/v1
bladeai:
  version: 0.7.0
  capability_source: live_host_calls_and_local_source
  source_contract:
    mcp_role: client
    config_file: mcp.json
    config_root: mcpServers
    supported_transports:
      - stdio
      - http_sse
    unsupported_transports:
      - streamable_http_client
    enabled_flag: BLADE_AI_MCP_ENABLED
    config_path_flag: BLADE_AI_MCP_CONFIG_PATH
    config_path_status: declared_but_loader_uses_default_home_path
    default_path: ~/.blade-ai/mcp.json
    runtime_transport_status: native_sse_runtime_live_qualified_read_only
    host_native_sse_listeners:
      k8s_ro: 127.0.0.1:18181
      telemetry_ro: 127.0.0.1:18182
      source_ro: 127.0.0.1:18183
    allowed_attach_to:
      - clarification
      - phase1
      - phase2
      - verifier
  benchmark_template:
    file: mcp.json.template
    read_only_servers:
      - k8s_ro
      - telemetry_ro
      - source_ro
    attach_to:
      k8s_ro:
        - clarification
        - verifier
      telemetry_ro:
        - clarification
        - verifier
      source_ro:
        - clarification
        - verifier
    controlled_write_servers:
      chaos_control:
        enabled: false
        reason: >
          BladeAI's target guard does not yet classify dynamic mutating MCP
          tools. The static-profile phase retains BladeAI's native ChaosBlade
          path and controls it through Trial-scoped RBAC.
  gates:
    before_qualifying_bladeai:
      - render template with runtime-only token
      - copy or symlink rendered file to ~/.blade-ai/mcp.json
      - set BLADE_AI_MCP_ENABLED=true
      - render URLs to host-native authenticated SSE listeners on loopback ports 18181-18183
      - verify startup logs contain MCP connected for k8s_ro, telemetry_ro, and source_ro
      - verify chaos_control is not connected from BladeAI
  live_evidence:
    status: client-qualified-stage2-adapter-manual-test-pending
    bladeAiVersion: 0.7.0
    serverReady: true
    connectedTools:
      k8s_ro: 5
      telemetry_ro: representative-call-passed
      source_ro: current-version-call-not-run
    chaosControlConnected: false
    attachTo:
      - clarification
      - verifier
    stage2StaticProfiles: manual-integration-pending
