apiVersion: resiliencebenchmark.io/v1alpha1
kind: ApplicationEnvironment
metadata:
  name: train-ticket
  displayName: Train Ticket
  benchmarkRole: complex-stateful-microservice
  visibility: agent-readable
spec:
  namespace:
    template: rb-train-ticket-{{episode_id}}
    liveReference: train-ticket
    lifecycle: per-episode-or-reused-namespace
  sourceSnapshot:
    repository: train-ticket
    lockRef: shared/source-locks.yaml#train-ticket-upstream
    remote: https://github.com/FudanSELab/train-ticket.git
    commit: 313886e99befb94be6cd45f085c98e0019f59829
    agentMountPath: /workspace/src/train-ticket
    readOnly: true
    leakControls:
      hideGroundTruth: true
      hideDefectPatch: true
      hideHealthyDiff: true
  imageLock:
    runtimeInventoryPolicyRef: ../shared/runtime-image-lock-policy.yaml
    registry: "{{HARBOR_REGISTRY}}"
    project: "{{HARBOR_PROJECT_TRAIN_TICKET}}"
    policy: digest-required
    images:
      - component: ts-order-service
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_TRAIN_TICKET}}/ts-order-service"
        tag: "{{IMAGE_TAG_TRAIN_TICKET_TS_ORDER_SERVICE}}"
        digest: "{{IMAGE_DIGEST_TRAIN_TICKET_TS_ORDER_SERVICE}}"
      - component: ts-travel-service
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_TRAIN_TICKET}}/ts-travel-service"
        tag: "{{IMAGE_TAG_TRAIN_TICKET_TS_TRAVEL_SERVICE}}"
        digest: "{{IMAGE_DIGEST_TRAIN_TICKET_TS_TRAVEL_SERVICE}}"
      - component: ts-route-service
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_TRAIN_TICKET}}/ts-route-service"
        tag: "{{IMAGE_TAG_TRAIN_TICKET_TS_ROUTE_SERVICE}}"
        digest: "{{IMAGE_DIGEST_TRAIN_TICKET_TS_ROUTE_SERVICE}}"
      - component: tsdb-mysql
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_TRAIN_TICKET}}/tsdb-mysql"
        tag: "{{IMAGE_TAG_TRAIN_TICKET_TSDB_MYSQL}}"
        digest: "{{IMAGE_DIGEST_TRAIN_TICKET_TSDB_MYSQL}}"
  workloads:
    primaryEntry:
      service: ts-gateway-service
      protocol: http
      port: 18888
      baseUrl: "{{TRAIN_TICKET_BASE_URL}}"
    criticalPaths:
      - id: search-trips
        description: Search direct travel options between two stations.
        syntheticLoadProfile: train-ticket-search
      - id: preserve-order
        description: Create and preserve an order after trip selection.
        syntheticLoadProfile: train-ticket-order
      - id: query-order
        description: Query current user order state after creation.
        syntheticLoadProfile: train-ticket-order-query
    steadyLoad:
      generator: controller-owned-python-workload
      profileRef: ../workloads/deterministic-profiles.yaml#train-ticket
      targetFlowQps: 1.0
  slos:
    - id: entry-success-rate
      queryRef: workload-summary:train-ticket-success-rate
      objective: ">= 0.95"
      window: 5m
    - id: entry-error-rate
      queryRef: workload-summary:train-ticket-error-rate
      objective: "<= 0.05"
      window: 5m
    - id: entry-p95-latency
      queryRef: workload-summary:train-ticket-p95-latency-ms
      objective: "<= 2500"
      window: 5m
    - id: entry-throughput-ratio
      queryRef: workload-summary:train-ticket-throughput-ratio
      objective: ">= 0.95"
      window: 5m
  observability:
    prometheus:
      sharedRef: shared/observability.yaml#prometheus
      serviceSelectors:
        appNamespace: "{{APPLICATION_NAMESPACE}}"
        servicePrefix: ts-
    jaeger:
      sharedRef: shared/observability.yaml#jaeger
      traceServiceNames:
        - ts-order-service
        - ts-travel-service
        - ts-route-service
        - ts-gateway-service
        - ts-ui-dashboard
    loki:
      sharedRef: shared/observability.yaml#loki
      labelSelectors:
        namespace: "{{APPLICATION_NAMESPACE}}"
  resetContract:
    idempotent: true
    strategy:
      - scale-load-generator-zero
      - delete-episode-chaosblade-crs
      - restart-application-deployments
      - wait-for-readiness
      - run-qualify
    protectedResources:
      - persistent-volume-claims
      - shared-observability-stack
      - external-harbor-projects
  qualifyContract:
    requiredSignals:
      - kubernetes-rollout-ready
      - prometheus-slo-window-healthy
      - jaeger-traces-present-for-critical-paths
      - workload-smoke-test-pass
    minimumHealthyWindow: 10m
    failurePolicy: block-episode
  readiness:
    currentStatus: workload-smoke-qualified-business-baseline-pending
    knownGaps:
      - observedAt: 2026-08-22
        severity: blocking
        item: The final 60-second business smoke passed, but the required 10-minute healthy baseline window has not yet been executed and archived.
      - observedAt: 2026-08-22
        severity: warning
        item: Nacos replica-to-replica registry equality was verified after repair but is not yet an automated reset/qualification gate.
    resolvedIssues:
      - resolvedAt: 2026-08-21
        item: A runtime-parameterized Python workload now implements login, search, preserve, order lookup, default order cancellation, abort thresholds, and streaming JTL evidence without embedding credentials or endpoints.
      - resolvedAt: 2026-08-21
        item: ts-order-service was restored from 0/2 to 2/2 Ready by a scoped rolling restart after its accept queue stopped draining.
        residualRisk: File descriptor and CLOSE_WAIT accumulation may recur; a sustained workload window is required before qualification.
      - resolvedAt: 2026-08-22
        item: The controller-owned workload image was built from commit 05685b72045d, pushed to Harbor, and pinned by manifest digest sha256:1f767740be52f0fd681bc16ef359c86a4989c67c5678d602239a52163a1018e0.
      - resolvedAt: 2026-08-22
        item: A 60-second Gateway-based order smoke completed 60 login, search, contact, preserve, query, and cancellation flows with 360/360 successful samples and 280 ms p95 latency.
      - resolvedAt: 2026-08-22
        item: Stale Nacos order, preserve, and Gateway registrations were removed by a rolling Nacos restart; all three Nacos replicas returned equal live instance sets before Gateway restart and smoke qualification.
    nextChecks:
      - Run and archive the full 10-minute order baseline while confirming application readiness and SLO queries for the complete window.
      - Automate Nacos replica equality and Kubernetes Pod-IP reconciliation as a fail-closed qualification check.
      - Freeze all component images by digest before building episodes.
      - Verify order creation, query, metrics, traces, and logs under steady load.
