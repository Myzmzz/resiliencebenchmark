apiVersion: resiliencebenchmark.io/v1alpha1
kind: ApplicationEnvironment
metadata:
  name: sock-shop
  displayName: Sock Shop
  benchmarkRole: ecommerce-reference-microservice
  visibility: agent-readable
spec:
  namespace:
    template: rb-sock-shop-{{episode_id}}
    liveReference: sock-shop
    lifecycle: per-episode-namespace
  sourceSnapshot:
    repository: sock-shop
    lockRef: shared/source-locks.yaml#sock-shop-deployment
    remote: https://github.com/microservices-demo/microservices-demo.git
    commit: 9dff06fae4981921caec6a62393a6ebfce4b3e3f
    agentMountPath: /workspace/src/sock-shop
    readOnly: true
    leakControls:
      hideGroundTruth: true
      hideDefectPatch: true
      hideHealthyDiff: true
  imageLock:
    runtimeInventoryPolicyRef: ../shared/runtime-image-lock-policy.yaml
    registry: "{{HARBOR_REGISTRY}}"
    project: "{{HARBOR_PROJECT_SOCK_SHOP}}"
    policy: digest-required
    images:
      - component: front-end
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_SOCK_SHOP}}/front-end"
        tag: "{{IMAGE_TAG_SOCK_SHOP_FRONT_END}}"
        digest: "{{IMAGE_DIGEST_SOCK_SHOP_FRONT_END}}"
      - component: catalogue
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_SOCK_SHOP}}/catalogue"
        tag: "{{IMAGE_TAG_SOCK_SHOP_CATALOGUE}}"
        digest: "{{IMAGE_DIGEST_SOCK_SHOP_CATALOGUE}}"
      - component: carts
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_SOCK_SHOP}}/carts"
        tag: "{{IMAGE_TAG_SOCK_SHOP_CARTS}}"
        digest: "{{IMAGE_DIGEST_SOCK_SHOP_CARTS}}"
      - component: orders
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_SOCK_SHOP}}/orders"
        tag: "{{IMAGE_TAG_SOCK_SHOP_ORDERS}}"
        digest: "{{IMAGE_DIGEST_SOCK_SHOP_ORDERS}}"
      - component: payment
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_SOCK_SHOP}}/payment"
        tag: "{{IMAGE_TAG_SOCK_SHOP_PAYMENT}}"
        digest: "{{IMAGE_DIGEST_SOCK_SHOP_PAYMENT}}"
      - component: shipping
        repository: "{{HARBOR_REGISTRY}}/{{HARBOR_PROJECT_SOCK_SHOP}}/shipping"
        tag: "{{IMAGE_TAG_SOCK_SHOP_SHIPPING}}"
        digest: "{{IMAGE_DIGEST_SOCK_SHOP_SHIPPING}}"
  workloads:
    primaryEntry:
      service: front-end
      protocol: http
      baseUrl: "{{SOCK_SHOP_BASE_URL}}"
    criticalPaths:
      - id: browse-catalogue
        description: Browse the product catalogue from the front end.
        syntheticLoadProfile: sock-shop-browse
      - id: add-to-cart
        description: Add a product to a user cart.
        syntheticLoadProfile: sock-shop-cart
      - id: checkout-order
        description: Complete checkout through order, payment, and shipping services.
        syntheticLoadProfile: sock-shop-checkout
    steadyLoad:
      generator: controller-owned-locust
      profileRef: ../workloads/deterministic-profiles.yaml#sock-shop
      users: 5
  slos:
    - id: entry-success-rate
      queryRef: workload-summary:sock-shop-success-rate
      objective: ">= 0.95"
      window: 5m
    - id: entry-error-rate
      queryRef: workload-summary:sock-shop-error-rate
      objective: "<= 0.05"
      window: 5m
    - id: entry-p95-latency
      queryRef: workload-summary:sock-shop-p95-latency-ms
      objective: "<= 1500"
      window: 5m
    - id: entry-throughput-ratio
      queryRef: workload-summary:sock-shop-throughput-ratio
      objective: ">= 0.95"
      window: 5m
  observability:
    prometheus:
      sharedRef: shared/observability.yaml#prometheus
      serviceSelectors:
        appNamespace: "{{APPLICATION_NAMESPACE}}"
        serviceNames:
          - front-end
          - catalogue
          - carts
          - orders
          - payment
          - shipping
    jaeger:
      sharedRef: shared/observability.yaml#jaeger
      traceServiceNames:
        - front-end
        - catalogue
        - carts
        - orders
        - payment
        - shipping
    loki:
      sharedRef: shared/observability.yaml#loki
      labelSelectors:
        namespace: "{{APPLICATION_NAMESPACE}}"
  resetContract:
    idempotent: true
    strategy:
      - delete-episode-namespace
      - recreate-namespace-from-locked-manifests
      - wait-for-readiness
      - run-qualify
    protectedResources:
      - shared-observability-stack
      - external-harbor-projects
  qualifyContract:
    requiredSignals:
      - kubernetes-rollout-ready
      - prometheus-slo-window-healthy
      - jaeger-traces-present-for-critical-paths
      - workload-smoke-test-pass
    minimumHealthyWindow: 10m
    failurePolicy: block-episode
  readiness:
    currentStatus: inactive-standby-otel-demo-selected
    knownGaps:
      - observedAt: 2026-08-22
        severity: informational
        item: All 14 Deployments are intentionally scaled to zero while OTel Demo is the selected test system; original replicas are preserved in standby annotations.
      - observedAt: 2026-08-22
        severity: blocking
        item: The deterministic workload passed a 60-second smoke, but two repeatable 10-minute healthy runs have not yet frozen the throughput baseline.
      - observedAt: 2026-08-22
        severity: blocking
        item: Prometheus series and Loki streams are present, but recent Jaeger services cannot yet be attributed to Sock Shop critical paths with sufficient confidence.
    resolvedIssues:
      - resolvedAt: 2026-08-21
        item: Canonical commit, 8 component source commits, archive hashes, 14 image pins, object allowlist, and stable Kubernetes node selector are recorded and server-side dry-run passed.
      - resolvedAt: 2026-08-22
        item: All 14 source images were mirrored to Harbor with exact linux/amd64 manifest digests and rendered as repository:tag@digest references.
      - resolvedAt: 2026-08-22
        item: All 14 Deployments became Ready and the front-end root, catalogue, tags, and customers business endpoints returned HTTP 200.
      - resolvedAt: 2026-08-22
        item: Runtime image inventory qualified all 15 Sock Shop containers by digest; Prometheus namespace series and a recent Loki stream were observed.
      - resolvedAt: 2026-08-22
        item: Redis session persistence and legacy Mongo protocol compatibility were repaired for session, cart, and order paths; the synthetic workload account has one linked address and card.
      - resolvedAt: 2026-08-22
        item: The fixed-seed catalogue, cart, and checkout smoke completed 360 samples with 0 failures, 310 ms entry p95 latency, and 6.0965 requests/s; its structured summary is retained on the result PVC.
    nextChecks:
      - Run two 10-minute no-fault profiles and freeze the accepted throughput baseline and artifact digests.
      - Produce Sock Shop traffic and verify trace-service attribution for front-end and downstream critical paths.
      - Keep payment-limit-safe cart isolation in the reset qualification before enabling Episodes.
