apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: train-ticket-workload-results
  namespace: train-ticket
  labels:
    app.kubernetes.io/managed-by: resiliencebenchmark
    resiliencebenchmark.io/purpose: workload-results
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
