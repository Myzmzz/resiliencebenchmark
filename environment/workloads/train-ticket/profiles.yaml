apiVersion: resiliencebenchmark.io/v1alpha1
kind: TrainTicketWorkloadProfileSet
metadata:
  name: train-ticket-controller-workloads
  visibility: public-agent-readable
spec:
  generator:
    kind: python
    image: "{{TRAIN_TICKET_WORKLOAD_IMAGE_REPOSITORY}}:{{TRAIN_TICKET_WORKLOAD_IMAGE_TAG}}@{{TRAIN_TICKET_WORKLOAD_IMAGE_DIGEST}}"
    command:
      - /opt/resiliencebenchmark/train-ticket/run-workload.sh
    resultArtifact: /results/train-ticket.jtl
  profiles:
    - id: baseline
      description: Deterministic mixed entry workload for baseline and recovery qualification.
      randomSeed: 2026082201
      trafficMix:
        - flow: search
          weightPercent: 60
        - flow: login
          weightPercent: 10
        - flow: order
          weightPercent: 30
      targetFlowQps: 1.0
      concurrency: 1
      durationSeconds: 600
      cleanupCreatedOrders: true
      resultArtifact: /results/train-ticket-baseline.jtl
      steps:
        - name: search-flow
          method: MIXED
          path: profile://search
          weight: 0.6
          requiresAuthentication: false
        - name: login-flow
          method: MIXED
          path: profile://login
          weight: 0.1
          requiresAuthentication: false
        - name: order-flow
          method: MIXED
          path: profile://order
          weight: 0.3
          requiresAuthentication: true
      abortThresholds:
        maxErrorRate: 0.05
        maxP95LatencyMs: 2500
        maxConsecutiveFailures: 20
    - id: search
      description: Search direct travel options without creating orders.
      targetFlowQps: 2.0
      concurrency: 4
      durationSeconds: 600
      steps:
        - name: search-trips
          method: POST
          path: /api/v1/travelservice/trips/left
          weight: 1.0
          requiresAuthentication: false
      abortThresholds:
        maxErrorRate: 0.02
        maxP95LatencyMs: 2000
        maxConsecutiveFailures: 20
    - id: login
      description: Authenticate a runtime-supplied user and refresh the session.
      targetFlowQps: 0.2
      concurrency: 1
      durationSeconds: 600
      steps:
        - name: login
          method: POST
          path: /api/v1/users/login
          weight: 1.0
          requiresAuthentication: false
      abortThresholds:
        maxErrorRate: 0.01
        maxP95LatencyMs: 1500
        maxConsecutiveFailures: 5
    - id: order
      description: Search, preserve, and query orders for a runtime-supplied user.
      targetFlowQps: 1.0
      concurrency: 1
      durationSeconds: 600
      cleanupCreatedOrders: true
      steps:
        - name: login
          method: POST
          path: /api/v1/users/login
          weight: 0.1
          requiresAuthentication: false
        - name: search-trips
          method: POST
          path: /api/v1/travelservice/trips/left
          weight: 0.5
          requiresAuthentication: true
        - name: preserve-order
          method: POST
          path: /api/v1/preserveservice/preserve
          alternatePath: /api/v1/preserveotherservice/preserveOther
          weight: 0.3
          requiresAuthentication: true
        - name: query-order
          method: POST
          path: /api/v1/orderservice/order/refresh
          weight: 0.1
          requiresAuthentication: true
        - name: cleanup-order
          method: GET
          path: /api/v1/cancelservice/cancel/{orderId}/{accountId}
          weight: 0.1
          requiresAuthentication: true
          enabledByDefault: true
      abortThresholds:
        maxErrorRate: 0.02
        maxP95LatencyMs: 2500
        maxConsecutiveFailures: 20
