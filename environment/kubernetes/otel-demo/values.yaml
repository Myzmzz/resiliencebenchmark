    - name: KAFKA_ADVERTISED_LISTENERS
      value: PLAINTEXT://kafka:9092
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4318
    - name: KAFKA_HEAP_OPTS
      value: -Xmx400M -Xms400M
    - name: KAFKA_LISTENERS
      value: PLAINTEXT://:9092,CONTROLLER://:9093
    - name: KAFKA_CONTROLLER_LISTENER_NAMES
      value: CONTROLLER
    - name: KAFKA_CONTROLLER_QUORUM_VOTERS
      value: 1@kafka:9093
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    ports:
    - name: plaintext
      value: 9092
    - name: controller
      value: 9093
    replicas: 1
    resources:
      limits:
        memory: 600Mi
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
    useDefault:
      env: true
  llm:
    enabled: true
    env:
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    service:
      port: 8000
    useDefault:
