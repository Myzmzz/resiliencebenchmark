components:
  accounting:
    enabled: true
    env:
    - name: KAFKA_ADDR
      value: kafka:9092
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4318
    - name: DB_CONNECTION_STRING
      value: Host=postgresql;Username=${OTEL_DEMO_POSTGRES_PASSWORD}u;Password=${OTEL_DEMO_POSTGRES_PASSWORD}p;Database=${OTEL_DEMO_POSTGRES_PASSWORD}
    - name: OTEL_DOTNET_AUTO_TRACES_ENTITYFRAMEWORKCORE_INSTRUMENTATION_ENABLED
      value: 'false'
    initContainers:
    - command:
      - sh
      - -c
      - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
      image: ${HARBOR_REGISTRY}/train-ticket/busybox:1.32
      name: wait-for-kafka
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 120Mi
    useDefault:
      env: true
  ad:
    enabled: true
    env:
    - name: AD_PORT
      value: '8080'
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4318
    - name: OTEL_LOGS_EXPORTER
      value: otlp
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 300Mi
    service:
      port: 8080
    useDefault:
      env: true
  cart:
    enabled: true
    env:
    - name: CART_PORT
      value: '8080'
    - name: ASPNETCORE_URLS
      value: http://*:$(CART_PORT)
    - name: VALKEY_ADDR
      value: valkey-cart:6379
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    initContainers:
    - command:
      - sh
      - -c
      - until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep
        2; done;
      image: ${HARBOR_REGISTRY}/train-ticket/busybox:1.32
      name: wait-for-valkey-cart
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 160Mi
    service:
      port: 8080
    useDefault:
      env: true
  checkout:
    enabled: true
    env:
    - name: CHECKOUT_PORT
      value: '8080'
    - name: CART_ADDR
      value: cart:8080
    - name: CURRENCY_ADDR
      value: currency:8080
    - name: EMAIL_ADDR
      value: http://email:8080
    - name: PAYMENT_ADDR
      value: payment:8080
    - name: PRODUCT_CATALOG_ADDR
      value: product-catalog:8080
    - name: SHIPPING_ADDR
      value: http://shipping:8080
    - name: KAFKA_ADDR
      value: kafka:9092
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    - name: GOMEMLIMIT
      value: 16MiB
    initContainers:
    - command:
      - sh
      - -c
      - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
      image: ${HARBOR_REGISTRY}/train-ticket/busybox:1.32
      name: wait-for-kafka
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 20Mi
    service:
      port: 8080
    useDefault:
      env: true
  currency:
    enabled: true
    env:
    - name: CURRENCY_PORT
      value: '8080'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    - name: VERSION
      value: '{{ .Chart.AppVersion }}'
    - name: IPV6_ENABLED
      value: 'false'
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 20Mi
    service:
      port: 8080
    useDefault:
      env: true
  email:
    enabled: true
    env:
    - name: EMAIL_PORT
      value: '8080'
    - name: APP_ENV
      value: production
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4318
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 100Mi
    service:
      port: 8080
    useDefault:
      env: true
  flagd:
    additionalVolumes:
    - configMap:
        name: flagd-config
      name: config-ro
    command:
    - /flagd-build
    - start
    - --port
    - '8013'
    - --ofrep-port
    - '8016'
    - --uri
    - file:./etc/flagd/demo.flagd.json
    enabled: true
    env:
    - name: FLAGD_METRICS_EXPORTER
      value: ${OTEL_DEMO_POSTGRES_PASSWORD}
    - name: FLAGD_OTEL_COLLECTOR_URI
      value: $(OTEL_COLLECTOR_NAME):4317
    - name: GOMEMLIMIT
      value: 60MiB
    imageOverride:
      repository: ${HARBOR_REGISTRY}/observe/flagd
      tag: v0.12.9
    initContainers:
    - command:
      - sh
      - -c
      - cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json
      image: ${HARBOR_REGISTRY}/train-ticket/busybox:1.32
      name: init-config
      volumeMounts:
      - mountPath: /config-ro
        name: config-ro
      - mountPath: /config-rw
        name: config-rw
    mountedEmptyDirs:
    - mountPath: /etc/flagd
      name: config-rw
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    ports:
    - name: rpc
      value: 8013
    - name: ofrep
      value: 8016
    replicas: 1
    resources:
      limits:
        memory: 75Mi
    sidecarContainers:
    - command:
      - /app/bin/server
      env:
      - name: FLAGD_METRICS_EXPORTER
        value: ${OTEL_DEMO_POSTGRES_PASSWORD}
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: FLAGD_UI_PORT
        value: '4000'
      - name: SECRET_KEY_BASE
        value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
      - name: PHX_HOST
        value: localhost
      name: flagd-ui
      resources:
        limits:
          memory: 250Mi
      service:
        port: 4000
      useDefault:
        env: true
      volumeMounts:
      - mountPath: /app/data
        name: config-rw
    useDefault:
      env: true
  fraud-detection:
    enabled: true
    env:
    - name: KAFKA_ADDR
      value: kafka:9092
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4318
    - name: OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES
      value: 'true'
    - name: OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED
      value: 'true'
    initContainers:
    - command:
      - sh
      - -c
      - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
      image: ${HARBOR_REGISTRY}/train-ticket/busybox:1.32
      name: wait-for-kafka
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 300Mi
    useDefault:
      env: true
  frontend:
    enabled: true
    env:
    - name: FRONTEND_PORT
      value: '8080'
    - name: PORT
      value: $(FRONTEND_PORT)
    - name: FRONTEND_ADDR
      value: :8080
    - name: AD_ADDR
      value: ad:8080
    - name: CART_ADDR
      value: cart:8080
    - name: CHECKOUT_ADDR
      value: checkout:8080
    - name: CURRENCY_ADDR
      value: currency:8080
    - name: PRODUCT_CATALOG_ADDR
      value: product-catalog:8080
    - name: PRODUCT_REVIEWS_ADDR
