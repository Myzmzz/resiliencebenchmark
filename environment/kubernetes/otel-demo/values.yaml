    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: FLAGD_OFREP_PORT
      value: '8016'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 500Mi
    service:
      port: 8089
    useDefault:
      env: true
    replicas: 1
  payment:
    enabled: true
    env:
    - name: PAYMENT_PORT
      value: '8080'
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    - name: IPV6_ENABLED
      value: 'false'
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
