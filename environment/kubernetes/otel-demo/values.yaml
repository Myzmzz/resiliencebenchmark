          - k8s.daemonset.name
          - k8s.daemonset.uid
          - k8s.job.name
          - k8s.job.uid
          - k8s.container.name
          - k8s.cronjob.name
          - k8s.statefulset.name
          - k8s.statefulset.uid
          - container.image.tag
          - container.image.name
          - k8s.cluster.uid
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
          otel_annotations: true
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
        - action: insert
          from_attribute: k8s.pod.uid
          key: service.instance.id
      resourcedetection:
        detectors:
        - env
        - system
      transform:
        error_mode: ignore
        trace_statements:
        - conditions:
          - span.kind == SPAN_KIND_SERVER and resource.attributes["service.name"]
            == "frontend" and span.attributes["http.route"] == nil
          context: span
          statements:
          - set(span.attributes["http.route"], "/api/cart") where IsMatch(span.attributes["http.target"],
            "\\/api\\/cart")
          - set(span.attributes["http.route"], "/api/checkout") where IsMatch(span.attributes["http.target"],
            "\\/api\\/checkout")
          - set(span.attributes["http.route"], "/api/products/{productId}") where
            IsMatch(span.attributes["http.target"], "\\/api\\/products\\/.*")
          - set(span.attributes["http.route"], "/api/recommendations") where IsMatch(span.attributes["http.target"],
            "\\/api\\/recommendations")
          - set(span.attributes["http.route"], "/api/data") where IsMatch(span.attributes["http.target"],
            "\\/api\\/data.*")
        - context: span
          statements:
          - set_semconv_span_name("1.37.0", "unsanitized_span_name")
    receivers:
      hostmetrics:
        collection_interval: 10s
        root_path: /hostfs
        scrapers:
          cpu: null
          disk: null
          filesystem:
            exclude_fs_types:
