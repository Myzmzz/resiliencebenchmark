  autoscaling:
    additionalMetrics: []
    behavior: {}
    enabled: false
    maxReplicas: 10
    minReplicas: 1
    targetCPUUtilizationPercentage: 80
  clusterRole:
    annotations: {}
    clusterRoleBinding:
      annotations: {}
      name: ''
    create: false
    name: ''
    rules: []
  command:
    extraArgs: []
    name: ${OTEL_DEMO_POSTGRES_PASSWORD}col-contrib
  config:
    connectors:
      spanmetrics: {}
    exporters:
      debug:
        verbosity: basic
      opensearch:
        http:
          endpoint: http://opensearch:9200
          tls:
            insecure: true
        logs_index: ${OTEL_DEMO_POSTGRES_PASSWORD}-logs
        logs_index_time_format: yyyy-MM-dd
      otlp/jaeger:
        endpoint: jaeger-query.observability.svc.cluster.local:4317
        sending_queue: {}
        tls:
          insecure: true
      otlphttp/coroot:
        endpoint: http://coroot-coroot.coroot.svc.cluster.local:8080
        tls:
          insecure: true
      otlphttp/prometheus:
        endpoint: http://prometheus.observability.svc.cluster.local:9090/api/v1/otlp
        sending_queue: {}
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      k8s_observer:
        auth_type: serviceAccount
        node: ${env:K8S_NODE_NAME}
    processors:
      batch:
        send_batch_size: 1024
        timeout: 5s
      k8sattributes:
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.pod.start_time
          - k8s.deployment.name
