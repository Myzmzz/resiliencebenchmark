      value: /otlp-http/v1/traces
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 250Mi
    securityContext:
      runAsGroup: 1001
      runAsNonRoot: true
      runAsUser: 1001
    service:
      port: 8080
    useDefault:
      env: true
  frontend-proxy:
    enabled: true
    env:
    - name: ENVOY_PORT
      value: '8080'
    - name: ENVOY_ADDR
      value: 0.0.0.0
    - name: ENVOY_ADMIN_PORT
      value: '10000'
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: FLAGD_UI_HOST
      value: flagd
    - name: FLAGD_UI_PORT
      value: '4000'
    - name: FRONTEND_HOST
      value: frontend
    - name: FRONTEND_PORT
      value: '8080'
    - name: GRAFANA_HOST
      value: grafana
    - name: GRAFANA_PORT
      value: '80'
    - name: IMAGE_PROVIDER_HOST
      value: image-provider
    - name: IMAGE_PROVIDER_PORT
      value: '8081'
    - name: JAEGER_HOST
      value: jaeger
    - name: JAEGER_UI_PORT
      value: '16686'
    - name: LOCUST_WEB_HOST
      value: load-generator
    - name: LOCUST_WEB_PORT
      value: '8089'
    - name: OTEL_COLLECTOR_HOST
      value: $(OTEL_COLLECTOR_NAME)
    - name: OTEL_COLLECTOR_PORT_GRPC
      value: '4317'
    - name: OTEL_COLLECTOR_PORT_HTTP
      value: '4318'
    podAnnotations:
      io.opentelemetry.discovery.metrics/config: "targets:\n  - endpoint: \"http://`endpoint`\"\
        \n"
      io.opentelemetry.discovery.metrics/enabled: 'true'
      io.opentelemetry.discovery.metrics/scraper: httpcheck
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 65Mi
    securityContext:
      runAsGroup: 101
      runAsNonRoot: true
      runAsUser: 101
    service:
      nodePort: 30881
      port: 8080
      type: NodePort
    useDefault:
      env: true
