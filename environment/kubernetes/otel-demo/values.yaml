      limits:
        memory: 140Mi
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
    service:
      port: 8080
    useDefault:
      env: true
  postgresql:
    additionalVolumeMounts:
    - mountPath: /dev/shm
      name: dshm
    additionalVolumes:
    - emptyDir:
        medium: Memory
        sizeLimit: 128Mi
      name: dshm
    command:
    - /usr/local/bin/docker-entrypoint.sh
    - postgres
    enabled: true
    env:
    - name: POSTGRES_USER
      value: root
    - name: POSTGRES_PASSWORD
      value: ${OTEL_DEMO_POSTGRES_PASSWORD}
    - name: POSTGRES_DB
      value: ${OTEL_DEMO_POSTGRES_PASSWORD}
    - name: POSTGRES_INITDB_ARGS
      value: -c huge_pages=off
    imageOverride:
      repository: ${HARBOR_REGISTRY}/observe/postgres
      tag: '16'
    mountedConfigMaps:
    - existingConfigMap: postgresql-init
      mountPath: /docker-entrypoint-initdb.d
      name: postgresql-init
    podAnnotations:
      io.opentelemetry.discovery.metrics/config: "username: root\npassword: ${OTEL_DEMO_POSTGRES_PASSWORD}\n\
        metrics:\n  postgresql.blks_hit:\n    enabled: true\n  postgresql.blks_read:\n\
        \    enabled: true\n  postgresql.tup_fetched:\n    enabled: true\n  postgresql.tup_returned:\n\
        \    enabled: true\n  postgresql.tup_inserted:\n    enabled: true\n  postgresql.tup_updated:\n\
        \    enabled: true\n  postgresql.tup_deleted:\n    enabled: true\n  postgresql.deadlocks:\n\
        \    enabled: true\ntls:\n  insecure: true\n"
      io.opentelemetry.discovery.metrics/enabled: 'true'
      io.opentelemetry.discovery.metrics/scraper: postgresql
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    replicas: 1
    resources:
      limits:
        memory: 256Mi
    service:
      port: 5432
    useDefault:
      env: false
  product-catalog:
    command:
    - ./product-catalog
    enabled: true
    env:
    - name: PRODUCT_CATALOG_PORT
      value: '8080'
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: GOMEMLIMIT
      value: 16MiB
    - name: DB_CONNECTION_STRING
      value: postgres://${OTEL_DEMO_POSTGRES_PASSWORD}u:${OTEL_DEMO_POSTGRES_PASSWORD}p@postgresql/${OTEL_DEMO_POSTGRES_PASSWORD}?sslmode=disable
    - name: OTEL_SEMCONV_STABILITY_OPT_IN
      value: database
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 100Mi
    service:
      port: 8080
    useDefault:
      env: true
  product-reviews:
    enabled: true
    env:
    - name: OPENAI_API_KEY
      value: ${OTEL_DEMO_OPENAI_API_KEY}
    - name: LLM_MODEL
      value: astronomy-llm
    - name: LLM_HOST
      value: llm
    - name: LLM_PORT
      value: '8000'
    - name: LLM_BASE_URL
      value: http://$(LLM_HOST):$(LLM_PORT)/v1
    - name: PRODUCT_REVIEWS_PORT
      value: '3551'
    - name: PRODUCT_CATALOG_ADDR
      value: product-catalog:8080
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: DB_CONNECTION_STRING
      value: host=postgresql user=${OTEL_DEMO_POSTGRES_PASSWORD}u password=${OTEL_DEMO_POSTGRES_PASSWORD}p
        dbname=${OTEL_DEMO_POSTGRES_PASSWORD}
    - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
      value: python
    - name: OTEL_PYTHON_LOG_CORRELATION
      value: 'true'
    - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
      value: 'true'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 100Mi
    service:
      port: 3551
    useDefault:
      env: true
  quote:
    command:
    - docker-php-entrypoint
    - php
    - public/index.php
    enabled: true
    env:
    - name: QUOTE_PORT
      value: '8080'
    - name: OTEL_PHP_AUTOLOAD_ENABLED
      value: 'true'
    - name: OTEL_PHP_INTERNAL_METRICS_ENABLED
      value: 'true'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4318
    - name: IPV6_ENABLED
      value: 'false'
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 40Mi
    securityContext:
      runAsGroup: 33
      runAsNonRoot: true
      runAsUser: 33
    service:
      port: 8080
    useDefault:
      env: true
  recommendation:
    command:
    - /venv/bin/opentelemetry-instrument
    - /venv/bin/python
    - recommendation_server.py
    enabled: true
    env:
    - name: RECOMMENDATION_PORT
      value: '8080'
    - name: PRODUCT_CATALOG_ADDR
      value: product-catalog:8080
    - name: OTEL_PYTHON_LOG_CORRELATION
      value: 'true'
    - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
      value: python
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 500Mi
    service:
      port: 8080
    useDefault:
      env: true
  shipping:
    command:
    - ./shipping
    enabled: true
    env:
    - name: SHIPPING_PORT
      value: '8080'
    - name: QUOTE_ADDR
      value: http://quote:8080
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4317
    - name: IPV6_ENABLED
      value: 'false'
    podAnnotations:
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    resources:
      limits:
        memory: 20Mi
    service:
      port: 8080
    useDefault:
      env: true
  valkey-cart:
    command:
    - /usr/local/bin/docker-entrypoint.sh
    - valkey-server
    enabled: true
    imageOverride:
      repository: ${HARBOR_REGISTRY}/observe/valkey
      tag: 9.0.1-alpine3.23
    podAnnotations:
      io.opentelemetry.discovery.metrics/config: 'username: valkey

        collection_interval: 10s

        '
      io.opentelemetry.discovery.metrics/enabled: 'true'
      io.opentelemetry.discovery.metrics/scraper: redis
      resource.opentelemetry.io/service.namespace: ${OTEL_DEMO_POSTGRES_PASSWORD}-demo
    ports:
    - name: valkey-cart
      value: 6379
    replicas: 1
    resources:
      limits:
        memory: 20Mi
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 999
    useDefault:
      env: false
default:
  env:
  - name: OTEL_SERVICE_NAME
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.labels['app.kubernetes.io/component']
  - name: OTEL_COLLECTOR_NAME
