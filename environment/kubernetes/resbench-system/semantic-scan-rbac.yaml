apiVersion: v1
kind: Namespace
metadata:
  name: resbench-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resbench-semantic-scan
  namespace: resbench-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resbench-semantic-scan-readonly
  namespace: otel-demo
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources:
      - destinationrules
      - envoyfilters
      - virtualservices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["keda.sh"]
    resources:
      - scaledobjects
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resbench-semantic-scan-readonly
  namespace: otel-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resbench-semantic-scan-readonly
subjects:
  - kind: ServiceAccount
    name: resbench-semantic-scan
    namespace: resbench-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resbench-semantic-scan-chaosblade-crd-read
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["chaosblades.chaosblade.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resbench-semantic-scan-chaosblade-crd-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: resbench-semantic-scan-chaosblade-crd-read
subjects:
  - kind: ServiceAccount
    name: resbench-semantic-scan
    namespace: resbench-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resbench-semantic-scan-chaosblade-tool-read
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["chaosblade-tool"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resbench-semantic-scan-chaosblade-tool-read
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resbench-semantic-scan-chaosblade-tool-read
subjects:
  - kind: ServiceAccount
    name: resbench-semantic-scan
    namespace: resbench-system
