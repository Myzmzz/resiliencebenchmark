      matchLabels:
        app: nacos
    serviceName: nacos-headless
    template:
      metadata:
        annotations:
          kubectl.kubernetes.io/restartedAt: '2026-08-22T01:39:17+08:00'
          repair.train-ticket/nacos-force-v2: 2026-07-29-v2
        creationTimestamp: null
        labels:
          app: nacos
      spec:
        containers:
        - command:
          - bin/docker-startup.sh
          env:
          - name: NACOS_REPLICAS
            value: '3'
          - name: NACOS_SERVER_PORT
            value: '8848'
          - name: NACOS_APPLICATION_PORT
            value: '8848'
          - name: PREFER_HOST_MODE
            value: hostname
          - name: MODE
            value: cluster
          - name: NACOS_SERVERS
            value: nacos-0.nacos-headless.train-ticket.svc.cluster.local:8848 nacos-1.nacos-headless.train-ticket.svc.cluster.local:8848
              nacos-2.nacos-headless.train-ticket.svc.cluster.local:8848
          envFrom:
          - secretRef:
              name: nacos-mysql
          image: ${HARBOR_REGISTRY}/train-ticket/nacos-nacos-server:2.0.1
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command:
                - /bin/sh
                - -c
                - 'until curl --connect-timeout 2 --max-time 5 -fsS -H ''User-Agent:
                  Nacos-Server'' -X PUT ''http://127.0.0.1:8848/nacos/v1/ns/operator/switches?debug=true&entry=doubleWriteEnabled&value=false''
                  >/dev/null; do sleep 2; done'
          name: k8snacos
          ports:
          - containerPort: 8848
            name: client
            protocol: TCP
          - containerPort: 7848
            name: old-rpc
            protocol: TCP
          - containerPort: 9848
            name: client-rpc
            protocol: TCP
          - containerPort: 9849
            name: raft-rpc
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 8848
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        dnsPolicy: ClusterFirst
        initContainers:
        - command:
          - sh
          - -c
          - "echo \"Waiting for MySQL at ${MYSQL_SERVICE_HOST:-nacosdb-mysql-leader}:${MYSQL_SERVICE_PORT:-3306}\"\
            \nuntil nc -z \"${MYSQL_SERVICE_HOST:-nacosdb-mysql-leader}\" \"${MYSQL_SERVICE_PORT:-3306}\"\
            ; do\n  echo \"  not yet, retrying in 2s...\"\n  sleep 2\ndone\necho \"\
            MySQL is reachable\"\n"
          envFrom:
          - secretRef:
              name: nacos-mysql
          image: ${HARBOR_REGISTRY}/train-ticket/busybox:1.32
          imagePullPolicy: IfNotPresent
          name: initmysql
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
    updateStrategy:
      rollingUpdate:
        partition: 0
      type: RollingUpdate
