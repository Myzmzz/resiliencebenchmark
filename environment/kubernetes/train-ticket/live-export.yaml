apiVersion: v1
kind: List
metadata:
  name: train-ticket-live-export
items:
- apiVersion: v1
  data:
    nginx.conf: "events {}\nhttp {\n  server {\n    listen 8443 ssl;\n    ssl_certificate\
      \ /etc/nginx/tls/tls.crt;\n    ssl_certificate_key /etc/nginx/tls/tls.key;\n\
      \n    location / {\n      proxy_pass http://ts-gateway-service:18888;\n    \
      \  proxy_set_header Host $host;\n      proxy_set_header X-Forwarded-Proto https;\n\
      \      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    }\n\
      \  }\n}\n"
  kind: ConfigMap
  metadata:
    labels:
      app: ischaos-tls-gateway
    name: ischaos-tls-gateway-nginx
- apiVersion: v1
  data:
    NACOS_ADDRS: nacos-0.nacos-headless.train-ticket.svc.cluster.local:8848,nacos-1.nacos-headless.train-ticket.svc.cluster.local:8848,nacos-2.nacos-headless.train-ticket.svc.cluster.local:8848
  kind: ConfigMap
  metadata:
    annotations:
      meta.helm.sh/release-name: nacos
      meta.helm.sh/release-namespace: train-ticket
    labels:
      app.kubernetes.io/managed-by: Helm
    name: nacos
- apiVersion: v1
  data:
    create-peers.sh: "#!/bin/sh\nset -eu\ni=0\nwhile [ $i -lt 3 ]\ndo\n  if [ $i =\
      \ 0 ]\n  then\n    echo -n \"nacosdb-mysql-${i}.nacosdb-mysql.train-ticket:8801\"\
      \n  else\n    echo -n \",nacosdb-mysql-${i}.nacosdb-mysql.train-ticket:8801\"\
      \n  fi\n  i=$((i+1))\ndone\n"
    leader-start.sh: '#!/usr/bin/env bash

      curl -X PATCH -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      -H "Content-Type: application/json-patch+json" \

      --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_PORT_443_TCP_PORT/api/v1/namespaces/train-ticket/pods/$HOSTNAME
      \

      -d ''[{"op": "replace", "path": "/metadata/labels/role", "value": "leader"}]''

      '
    leader-stop.sh: '#!/usr/bin/env bash

      curl -X PATCH -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      -H "Content-Type: application/json-patch+json" \

      --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_PORT_443_TCP_PORT/api/v1/namespaces/train-ticket/pods/$HOSTNAME
      \

      -d ''[{"op": "replace", "path": "/metadata/labels/role", "value": "follower"}]''

      '
    node.cnf: '[mysqld]

      default_storage_engine=InnoDB

      max_connections=65535

      '
    server-id.cnf: '[mysqld]

      server-id=@@SERVER_ID@@

      '
  kind: ConfigMap
  metadata:
    annotations:
      meta.helm.sh/release-name: nacosdb
      meta.helm.sh/release-namespace: train-ticket
    labels:
      app: nacosdb-mysql
      app.kubernetes.io/managed-by: Helm
      chart: mysql-1.0.0
      heritage: Helm
      release: nacosdb
    name: nacosdb-mysql
- apiVersion: v1
  data:
    rabbitmq_host: rabbitmq
  kind: ConfigMap
  metadata:
    annotations:
