apiVersion: resiliencebenchmark.io/v1alpha1
kind: RuntimeSecretContract
metadata:
  name: train-ticket-runtime-secrets
spec:
  sourcePolicy: runtime-only-never-commit-values
  secrets:
  - name: harbor-secret
    type: kubernetes.io/dockerconfigjson
    requiredKeys:
    - .dockerconfigjson
  - name: ischaos-ts-gateway-tls
    type: kubernetes.io/tls
    requiredKeys:
    - tls.crt
    - tls.key
  - name: nacos-mysql
    type: Opaque
    provisionedBy: helm:nacos
    requiredKeys:
    - MYSQL_SERVICE_DB_NAME
    - MYSQL_SERVICE_HOST
    - MYSQL_SERVICE_PASSWORD
    - MYSQL_SERVICE_PORT
    - MYSQL_SERVICE_USER
  - name: nacosdb-mysql
    type: Opaque
    provisionedBy: helm:nacosdb
    requiredKeys:
    - mysql-password
    - mysql-replication-password
  - name: ts-assurance-mysql
    type: Opaque
    requiredKeys:
    - ASSURANCE_MYSQL_DATABASE
    - ASSURANCE_MYSQL_HOST
    - ASSURANCE_MYSQL_PASSWORD
    - ASSURANCE_MYSQL_PORT
    - ASSURANCE_MYSQL_USER
  - name: ts-auth-mysql
    type: Opaque
    requiredKeys:
    - AUTH_MYSQL_DATABASE
    - AUTH_MYSQL_HOST
    - AUTH_MYSQL_PASSWORD
    - AUTH_MYSQL_PORT
    - AUTH_MYSQL_USER
  - name: ts-config-mysql
    type: Opaque
    requiredKeys:
    - CONFIG_MYSQL_DATABASE
    - CONFIG_MYSQL_HOST
    - CONFIG_MYSQL_PASSWORD
    - CONFIG_MYSQL_PORT
    - CONFIG_MYSQL_USER
  - name: ts-consign-mysql
    type: Opaque
    requiredKeys:
    - CONSIGN_MYSQL_DATABASE
    - CONSIGN_MYSQL_HOST
    - CONSIGN_MYSQL_PASSWORD
    - CONSIGN_MYSQL_PORT
    - CONSIGN_MYSQL_USER
  - name: ts-consign-price-mysql
    type: Opaque
    requiredKeys:
    - CONSIGN_PRICE_MYSQL_DATABASE
    - CONSIGN_PRICE_MYSQL_HOST
    - CONSIGN_PRICE_MYSQL_PASSWORD
    - CONSIGN_PRICE_MYSQL_PORT
    - CONSIGN_PRICE_MYSQL_USER
  - name: ts-contacts-mysql
    type: Opaque
    requiredKeys:
    - CONTACTS_MYSQL_DATABASE
    - CONTACTS_MYSQL_HOST
    - CONTACTS_MYSQL_PASSWORD
