apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-tsdb
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: resiliencebenchmark-envprep
  annotations:
    benchmark.openai.com/cleanup-policy: protected
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
